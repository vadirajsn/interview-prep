<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Pattern Player — Interview Prep Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14;
  --panel:#131722;
  --panel2:#161b28;
  --border:#232A3B;
  --text:#E7E6E2;
  --dim:#8B93A7;
  --amber:#E8A33D;
  --teal:#4FD1C5;
  --coral:#EF6B6B;
  --line:#3A4256;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100%;}
.app{display:flex;min-height:100vh;}
.sidebar{width:280px;flex-shrink:0;border-right:1px solid var(--border);padding:28px 20px;display:flex;flex-direction:column;gap:22px;}
.brand h1{font-size:19px;margin:0 0 8px;letter-spacing:.2px;}
.brand p{font-size:12.5px;color:var(--dim);margin:0;line-height:1.55;}
nav.topics{display:flex;flex-direction:column;gap:5px;}
.topic-btn{display:flex;flex-direction:column;gap:2px;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--radius);padding:9px 12px;cursor:pointer;color:var(--text);font-family:inherit;width:100%;}
.topic-btn:hover{background:var(--panel);}
.topic-btn.active{background:var(--panel);border-color:var(--border);}
.topic-btn .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);}
.topic-btn .name{font-size:13.5px;font-weight:600;}
.topic-btn .sub{font-size:11px;color:var(--dim);}
.sidebar-foot{margin-top:auto;font-size:11px;color:var(--dim);line-height:1.6;border-top:1px solid var(--border);padding-top:14px;}
.sidebar-foot kbd{font-family:'IBM Plex Mono',monospace;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
.stage{flex:1;padding:32px 40px;max-width:1080px;}
.stage-header h2{margin:0 0 8px;font-size:23px;}
.stage-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--dim);}
.stage-blurb{color:var(--dim);font-size:13.5px;line-height:1.6;max-width:740px;margin:0 0 16px;}
.mode-row{display:none;gap:8px;margin-bottom:16px;}
.mode-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;}
.mode-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.08);}
.canvas-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;}
canvas{width:100%;display:block;border-radius:8px;}
.controls{display:flex;align-items:center;gap:8px;margin:14px 0;flex-wrap:wrap;}
.ctrl-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber);}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed;}
.ctrl-btn.play{width:auto;padding:0 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;gap:6px;}
.speed-wrap{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;font-family:'IBM Plex Mono',monospace;}
#speedRange{accent-color:var(--amber);}
.step-counter{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}
.tape-outer{position:relative;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);padding:12px 0;}
.tape{display:flex;gap:3px;padding:0 10px;overflow-x:auto;}
.tape::-webkit-scrollbar{height:4px;}
.tape::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tape-tick{flex:0 0 auto;width:9px;height:22px;border-radius:3px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;}
.tape-tick.past{background:#1c2433;border-color:#2b3245;}
.tape-tick.active{background:var(--amber);border-color:var(--amber);}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
.panel-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.panel-box h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);}
#frameNote{font-size:14px;line-height:1.65;color:var(--text);min-height:70px;}
pre#codeBlock{margin:0;font-family:'IBM Plex Mono',monospace;font-size:12.3px;line-height:1.75;color:var(--dim);overflow-x:auto;white-space:pre;}
pre#codeBlock .ln{display:block;padding:1px 8px;border-radius:4px;}
pre#codeBlock .ln.active{background:rgba(232,163,61,.12);color:var(--amber);}
@media (max-width:900px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:14px;gap:14px;}
  .brand,.sidebar-foot{display:none;}
  nav.topics{flex-direction:row;}
  .topic-btn{flex-shrink:0;min-width:150px;}
  .stage{padding:18px;}
  .bottom-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>DSA Pattern Player</h1>
      <p>Eight patterns behind most data-structure interview questions, replayed one step at a time.</p>
    </div>
    <nav class="topics" id="topicNav"></nav>
    <div class="sidebar-foot">
      <div><kbd>space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step</div>
    </div>
  </aside>
  <main class="stage">
    <div class="stage-header">
      <h2 id="stageTitle"></h2>
      <div class="stage-meta">
        <span class="pill" id="stageTag"></span>
        <span class="pill" id="stageLevel"></span>
      </div>
      <p class="stage-blurb" id="stageBlurb"></p>
      <div class="mode-row" id="modeRow"></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnReset" title="Reset">⟲</button>
      <button class="ctrl-btn" id="btnPrev" title="Previous step">◁</button>
      <button class="ctrl-btn play" id="btnPlay">▶ Play</button>
      <button class="ctrl-btn" id="btnNext" title="Next step">▷</button>
      <div class="speed-wrap">SPEED
        <input type="range" id="speedRange" min="1" max="4" value="2">
      </div>
      <div class="step-counter" id="stepCounter"></div>
    </div>

    <div class="tape-outer">
      <div class="tape" id="tape"></div>
    </div>

    <div class="bottom-grid">
      <div class="panel-box">
        <h3>What's happening</h3>
        <div id="frameNote"></div>
      </div>
      <div class="panel-box">
        <h3>Kotlin</h3>
        <pre id="codeBlock"></pre>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------------- shared drawing helpers ---------------- */
const FONT_MONO = "'IBM Plex Mono', monospace";
const FONT_SANS = "'IBM Plex Sans', sans-serif";
const COLORS = {
  bg:'#0B0E14', panel:'#131722', panel2:'#161b28', border:'#232A3B',
  text:'#E7E6E2', dim:'#8B93A7', amber:'#E8A33D', teal:'#4FD1C5',
  coral:'#EF6B6B', line:'#3A4256'
};

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function cell(ctx,x,y,w,h,text,opts){
  opts = opts||{};
  const fill = opts.fill||COLORS.panel, stroke = opts.stroke||COLORS.border, textColor = opts.textColor||COLORS.text;
  ctx.lineWidth = opts.lw||1.5;
  roundRect(ctx,x,y,w,h,8);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.stroke();
  ctx.fillStyle = textColor;
  ctx.font = `600 15px ${FONT_MONO}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x+w/2, y+h/2+1);
}
function arrow(ctx,x1,y1,x2,y2,opts){
  opts = opts||{};
  const color = opts.color||COLORS.dim, lw = opts.lw||2;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
  const angle = Math.atan2(y2-y1, x2-x1);
  ctx.save();
  ctx.fillStyle = color;
  ctx.translate(x2,y2); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-8,-4); ctx.lineTo(-8,4); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function label(ctx,x,y,text,opts){
  opts = opts||{};
  ctx.fillStyle = opts.color||COLORS.dim;
  ctx.font = `${opts.weight||600} ${opts.size||12}px ${opts.font||FONT_SANS}`;
  ctx.textAlign = opts.align||'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

/* ---------------- 1. Two Pointers ---------------- */
function twoPointerBuild(){
  const arr = [2,4,6,8,10,13,15,18];
  const target = 24;
  let lo = 0, hi = arr.length-1;
  const frames = [];
  frames.push({lo,hi,sum:null,status:'start',note:`Start with lo = 0 and hi = ${hi}. Looking for a pair that sums to ${target}.`,line:1});
  while(lo < hi){
    const sum = arr[lo]+arr[hi];
    frames.push({lo,hi,sum,status:'check',note:`arr[lo] = ${arr[lo]}, arr[hi] = ${arr[hi]} → sum = ${sum}.`,line:3});
    if(sum === target){
      frames.push({lo,hi,sum,status:'found',note:`sum equals target ${target}. Pair found: (${arr[lo]}, ${arr[hi]}).`,line:4});
      break;
    } else if(sum < target){
      frames.push({lo,hi,sum,status:'moveLo',note:`sum ${sum} < target ${target} → move lo right to increase the sum.`,line:5});
      lo++;
    } else {
      frames.push({lo,hi,sum,status:'moveHi',note:`sum ${sum} > target ${target} → move hi left to decrease the sum.`,line:5});
      hi--;
    }
  }
  return {context:{arr,target}, frames};
}
function renderTwoPointer(ctx,W,H,frame,context){
  const {arr,target} = context;
  const n = arr.length;
  const cw = Math.min(60,(W-60)/n), gap = 8;
  const totalW = n*cw+(n-1)*gap;
  const startX = (W-totalW)/2;
  const y = H/2-27;
  label(ctx,W/2,26,`Target sum = ${target}`,{size:13,color:COLORS.dim});
  for(let i=0;i<n;i++){
    const x = startX+i*(cw+gap);
    let fill=COLORS.panel, stroke=COLORS.border, tc=COLORS.text;
    if(frame.status==='found' && (i===frame.lo||i===frame.hi)){ fill='#123832'; stroke=COLORS.teal; tc=COLORS.teal; }
    else if(i===frame.lo){ fill='#2a220f'; stroke=COLORS.amber; tc=COLORS.amber; }
    else if(i===frame.hi){ fill='#301616'; stroke=COLORS.coral; tc=COLORS.coral; }
    cell(ctx,x,y,cw,54,String(arr[i]),{fill,stroke,textColor:tc});
    label(ctx,x+cw/2,y+70,String(i),{size:10,color:COLORS.dim});
    if(i===frame.lo) label(ctx,x+cw/2,y-16,'lo',{size:12,color:COLORS.amber,weight:700});
    if(i===frame.hi) label(ctx,x+cw/2,y-16,'hi',{size:12,color:COLORS.coral,weight:700});
  }
  if(frame.sum!=null){
    label(ctx,W/2,H-24,`sum = ${frame.sum}`,{size:15,weight:700,color: frame.status==='found'?COLORS.teal:COLORS.text});
  }
}

/* ---------------- 2. Linked List Reversal ---------------- */
function linkedListBuild(){
  const values = [10,20,30,40,50];
  const n = values.length;
  let next = values.map((_,i)=> i+1<n ? i+1 : -1);
  let prev = -1, curr = 0;
  const frames = [];
  frames.push({next:[...next],prev,curr,note:'Start: prev = NULL, curr = head (index 0).',line:2});
  while(curr!==-1){
    const nxt = next[curr];
    frames.push({next:[...next],prev,curr,note:`Save next = ${nxt===-1?'NULL':'index '+nxt} before rewiring curr.`,line:4});
    next[curr] = prev;
    frames.push({next:[...next],prev,curr,note:`Point curr.next backward to ${prev===-1?'NULL':'index '+prev}.`,line:5});
    prev = curr; curr = nxt;
    frames.push({next:[...next],prev,curr,note:'Advance prev and curr forward by one node.',line:6});
  }
  frames.push({next:[...next],prev,curr,note:`Reversal complete. New head is index ${prev} (value ${values[prev]}).`,line:9});
  return {context:{values}, frames};
}
function renderLinkedList(ctx,W,H,frame,context){
  const {values} = context;
  const n = values.length;
  const cw=64, ch=54, gap=46;
  const totalW = n*cw+(n-1)*gap;
  const startX = (W-totalW)/2;
  const y = H/2-27;
  const xOf = i => startX+i*(cw+gap);
  for(let i=0;i<n;i++){
    const nxt = frame.next[i];
    const y1 = y+ch/2;
    if(nxt===-1){
      const nx = xOf(i)+cw/2, ny = y+ch+34;
      arrow(ctx, xOf(i)+cw/2, y+ch+4, nx, ny-12, {color:COLORS.dim});
      label(ctx,nx,ny,'NULL',{size:11,color:COLORS.dim});
    } else if(nxt>i){
      arrow(ctx, xOf(i)+cw, y1-8, xOf(nxt), y1-8, {color:COLORS.line});
    } else {
      arrow(ctx, xOf(i), y1+8, xOf(nxt)+cw, y1+8, {color:COLORS.teal});
    }
  }
  for(let i=0;i<n;i++){
    let stroke=COLORS.border, fill=COLORS.panel, tc=COLORS.text;
    if(i===frame.curr){ stroke=COLORS.amber; fill='#2a220f'; tc=COLORS.amber; }
    else if(i===frame.prev){ stroke=COLORS.teal; fill='#123832'; tc=COLORS.teal; }
    cell(ctx,xOf(i),y,cw,ch,String(values[i]),{fill,stroke,textColor:tc});
  }
  if(frame.prev>=0) label(ctx,xOf(frame.prev)+cw/2,y-16,'prev',{color:COLORS.teal,weight:700,size:12});
  if(frame.curr>=0) label(ctx,xOf(frame.curr)+cw/2,y-34,'curr',{color:COLORS.amber,weight:700,size:12});
}

/* ---------------- 3. Stack — Valid Parentheses ---------------- */
function stackBuild(){
  const input = "{[()()]}";
  const pairs = {')':'(',']':'[','}':'{'};
  const stack = [];
  const frames = [];
  frames.push({i:-1,stack:[...stack],status:'start',note:'Scan left to right, pushing every opening bracket onto a stack.',line:1});
  for(let i=0;i<input.length;i++){
    const ch = input[i];
    if('([{'.includes(ch)){
      stack.push(ch);
      frames.push({i,stack:[...stack],status:'push',note:`'${ch}' is an opening bracket → push it.`,line:3});
    } else {
      const top = stack[stack.length-1];
      if(top===pairs[ch]){
        stack.pop();
        frames.push({i,stack:[...stack],status:'pop',note:`'${ch}' matches top of stack '${top}' → pop.`,line:4});
      } else {
        frames.push({i,stack:[...stack],status:'mismatch',note:`'${ch}' does not match the top of the stack → invalid.`,line:5});
        return {context:{input}, frames};
      }
    }
  }
  const valid = stack.length===0;
  frames.push({i:input.length,stack:[...stack],status: valid?'valid':'invalid',
    note: valid ? 'Stack is empty at the end → the string is valid.' : 'Stack is not empty at the end → the string is invalid.',line:7});
  return {context:{input}, frames};
}
function renderStack(ctx,W,H,frame,context){
  const {input} = context;
  const cw=42, ch=42, gap=6;
  const totalW = input.length*cw+(input.length-1)*gap;
  const startX = (W-totalW)/2;
  const topY = 40;
  for(let i=0;i<input.length;i++){
    const x = startX+i*(cw+gap);
    let fill=COLORS.panel, stroke=COLORS.border, tc=COLORS.text;
    if(i===frame.i){
      if(frame.status==='mismatch'){ fill='#301616'; stroke=COLORS.coral; tc=COLORS.coral; }
      else { fill='#2a220f'; stroke=COLORS.amber; tc=COLORS.amber; }
    } else if(i<frame.i){ tc=COLORS.dim; }
    cell(ctx,x,topY,cw,ch,input[i],{fill,stroke,textColor:tc});
  }
  const stackX = 60, baseY = H-60, sw=76, sh=38;
  label(ctx,stackX+sw/2,baseY+24,'stack',{size:11,color:COLORS.dim});
  for(let s=0;s<frame.stack.length;s++){
    const yy = baseY-(s+1)*(sh+6);
    cell(ctx,stackX,yy,sw,sh,frame.stack[s],{fill:'#161b28',stroke:COLORS.line,textColor:COLORS.text});
  }
  if(frame.status==='valid'||frame.status==='invalid'||frame.status==='mismatch'){
    const ok = frame.status==='valid';
    label(ctx,W/2,H-22,ok?'VALID ✓':'INVALID ✕',{size:16,weight:700,color: ok?COLORS.teal:COLORS.coral});
  }
}

/* ---------------- 4. Binary Search ---------------- */
function binarySearchBuild(){
  const arr = [3,7,11,15,20,25,31,40,45];
  const target = 25;
  let lo=0, hi=arr.length-1;
  const frames = [];
  frames.push({lo,hi,mid:null,found:false,note:`Search for ${target} in a sorted array. lo = 0, hi = ${hi}.`,line:1});
  while(lo<=hi){
    const mid = Math.floor((lo+hi)/2);
    frames.push({lo,hi,mid,found:false,note:`mid = ${mid} → arr[mid] = ${arr[mid]}.`,line:3});
    if(arr[mid]===target){
      frames.push({lo,hi,mid,found:true,note:`arr[mid] equals the target → found at index ${mid}.`,line:4});
      break;
    } else if(arr[mid]<target){
      frames.push({lo,hi,mid,found:false,note:'arr[mid] < target → search the right half.',line:5});
      lo = mid+1;
    } else {
      frames.push({lo,hi,mid,found:false,note:'arr[mid] > target → search the left half.',line:5});
      hi = mid-1;
    }
  }
  return {context:{arr,target}, frames};
}
function renderBinarySearch(ctx,W,H,frame,context){
  const {arr,target} = context;
  const n = arr.length;
  const cw = Math.min(56,(W-60)/n), gap = 8;
  const totalW = n*cw+(n-1)*gap;
  const startX = (W-totalW)/2;
  const y = H/2-27;
  label(ctx,W/2,26,`Target = ${target}`,{size:13,color:COLORS.dim});
  for(let i=0;i<n;i++){
    const x = startX+i*(cw+gap);
    let fill=COLORS.panel, stroke=COLORS.border, tc=COLORS.text;
    const inRange = i>=frame.lo && i<=frame.hi;
    if(!inRange){ tc=COLORS.dim; stroke='#1a1e2b'; }
    if(i===frame.mid){
      if(frame.found){ fill='#123832'; stroke=COLORS.teal; tc=COLORS.teal; }
      else { fill='#2a220f'; stroke=COLORS.amber; tc=COLORS.amber; }
    }
    cell(ctx,x,y,cw,54,String(arr[i]),{fill,stroke,textColor:tc});
    label(ctx,x+cw/2,y+70,String(i),{size:10,color:COLORS.dim});
  }
  const loX = startX+frame.lo*(cw+gap), hiX = startX+frame.hi*(cw+gap)+cw;
  label(ctx,loX,y-16,'lo',{size:11,color:COLORS.dim,align:'left'});
  label(ctx,hiX,y-16,'hi',{size:11,color:COLORS.dim,align:'right'});
}

/* ---------------- 5. Binary Tree Traversal ---------------- */
const TREE_LAYOUT = {
  '50':{x:0.5, y:0.06, left:'30', right:'70'},
  '30':{x:0.27,y:0.40, left:'20', right:'40'},
  '70':{x:0.73,y:0.40, left:'60', right:'80'},
  '20':{x:0.13,y:0.76, left:null, right:null},
  '40':{x:0.40,y:0.76, left:null, right:null},
  '60':{x:0.60,y:0.76, left:null, right:null},
  '80':{x:0.87,y:0.76, left:null, right:null},
};
const TREE_ROOT = '50';
const TREE_EDGES = [['50','30'],['50','70'],['30','20'],['30','40'],['70','60'],['70','80']];

function treeInorderBuild(){
  const frames = []; const visited = [];
  function rec(node){
    if(node==null) return;
    const info = TREE_LAYOUT[node];
    rec(info.left);
    visited.push(node);
    frames.push({current:node,visited:[...visited],frontier:[],frontierType:'stack',
      note:`Recurse into the left subtree first, then visit ${node}, then the right subtree.`,line:3});
    rec(info.right);
  }
  rec(TREE_ROOT);
  frames.push({current:null,visited:[...visited],frontier:[],frontierType:'stack',
    note:`In-order traversal complete: ${visited.join(' → ')}`,line:5});
  return {context:{}, frames};
}
function treeBFSBuild(){
  const frames = []; const visited = []; const queue = [TREE_ROOT];
  frames.push({current:null,visited:[],frontier:[...queue],frontierType:'queue',
    note:`Enqueue the root (${TREE_ROOT}).`,line:2});
  while(queue.length){
    const node = queue.shift();
    visited.push(node);
    frames.push({current:node,visited:[...visited],frontier:[...queue],frontierType:'queue',
      note:`Dequeue ${node} and visit it.`,line:6});
    const info = TREE_LAYOUT[node];
    const kids = [info.left,info.right].filter(Boolean);
    kids.forEach(k=>queue.push(k));
    if(kids.length){
      frames.push({current:node,visited:[...visited],frontier:[...queue],frontierType:'queue',
        note:`Enqueue children of ${node}: ${kids.join(', ')}.`,line:7});
    }
  }
  frames.push({current:null,visited:[...visited],frontier:[],frontierType:'queue',
    note:`Level-order traversal complete: ${visited.join(' → ')}`,line:10});
  return {context:{}, frames};
}
function renderTraversal(ctx,W,H,frame,layout,edges){
  const R = 24;
  const topMargin = 40, bottomMargin = 70;
  const usableH = H-topMargin-bottomMargin;
  edges.forEach(([a,b])=>{
    const pa=layout[a], pb=layout[b];
    const x1=pa.x*W, y1=topMargin+pa.y*usableH;
    const x2=pb.x*W, y2=topMargin+pb.y*usableH;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = COLORS.line; ctx.lineWidth = 2; ctx.stroke();
  });
  Object.keys(layout).forEach(id=>{
    const p = layout[id];
    const x = p.x*W, y = topMargin+p.y*usableH;
    let fill=COLORS.panel, stroke=COLORS.border, tc=COLORS.text;
    if(frame.visited.includes(id)){ fill='#123832'; stroke=COLORS.teal; tc=COLORS.teal; }
    if(id===frame.current){ fill='#2a220f'; stroke=COLORS.amber; tc=COLORS.amber; }
    ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2);
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke();
    ctx.fillStyle = tc; ctx.font = `700 15px ${FONT_MONO}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(id,x,y);
  });
  const ftLabel = frame.frontierType==='queue'
    ? `Queue (FIFO): [ ${frame.frontier.join(', ')} ]`
    : `Call stack (LIFO): [ ${frame.frontier.join(', ')} ]`;
  label(ctx,W/2,H-40,ftLabel,{size:13,color:COLORS.dim});
  label(ctx,W/2,H-18,`Visited: ${frame.visited.join(' → ')||'—'}`,{size:12,color:COLORS.text});
}
function renderTree(ctx,W,H,frame){ renderTraversal(ctx,W,H,frame,TREE_LAYOUT,TREE_EDGES); }

/* ---------------- 6. Graph Traversal ---------------- */
const GRAPH_EDGES = [['A','B'],['A','C'],['B','D'],['C','D'],['D','E'],['D','F'],['E','F']];
const GRAPH_ADJ = {};
GRAPH_EDGES.forEach(([a,b])=>{
  (GRAPH_ADJ[a]=GRAPH_ADJ[a]||[]).push(b);
  (GRAPH_ADJ[b]=GRAPH_ADJ[b]||[]).push(a);
});
Object.keys(GRAPH_ADJ).forEach(k=>GRAPH_ADJ[k].sort());
const GRAPH_LAYOUT = {
  A:{x:0.10,y:0.5}, B:{x:0.35,y:0.10}, C:{x:0.35,y:0.90},
  D:{x:0.62,y:0.5}, E:{x:0.88,y:0.10}, F:{x:0.88,y:0.90}
};

function graphBFSBuild(){
  const frames=[]; const visited=[]; const queue=['A']; const seen=new Set(['A']);
  frames.push({current:null,visited:[],frontier:[...queue],frontierType:'queue',note:'Start BFS at A. Enqueue A.',line:2});
  while(queue.length){
    const node = queue.shift();
    visited.push(node);
    frames.push({current:node,visited:[...visited],frontier:[...queue],frontierType:'queue',note:`Dequeue ${node} and mark it visited.`,line:6});
    const neighbors = GRAPH_ADJ[node].filter(nb=>!seen.has(nb));
    neighbors.forEach(nb=>{ seen.add(nb); queue.push(nb); });
    if(neighbors.length){
      frames.push({current:node,visited:[...visited],frontier:[...queue],frontierType:'queue',note:`Enqueue unvisited neighbors of ${node}: ${neighbors.join(', ')}.`,line:8});
    }
  }
  frames.push({current:null,visited:[...visited],frontier:[],frontierType:'queue',note:`BFS order: ${visited.join(' → ')}`,line:11});
  return {context:{}, frames};
}
function graphDFSBuild(){
  const frames=[]; const visited=[]; const seen=new Set(); const stackTrace=[];
  function rec(node){
    seen.add(node); visited.push(node); stackTrace.push(node);
    frames.push({current:node,visited:[...visited],frontier:[...stackTrace],frontierType:'stack',note:`Visit ${node}.`,line:2});
    GRAPH_ADJ[node].forEach(nb=>{
      if(!seen.has(nb)){
        frames.push({current:node,visited:[...visited],frontier:[...stackTrace],frontierType:'stack',note:`${node} → recurse into unvisited neighbor ${nb}.`,line:4});
        rec(nb);
      }
    });
    stackTrace.pop();
    frames.push({current:node,visited:[...visited],frontier:[...stackTrace],frontierType:'stack',note:`Backtrack from ${node}.`,line:6});
  }
  rec('A');
  frames.push({current:null,visited:[...visited],frontier:[],frontierType:'stack',note:`DFS order: ${visited.join(' → ')}`,line:6});
  return {context:{}, frames};
}
function renderGraph(ctx,W,H,frame){ renderTraversal(ctx,W,H,frame,GRAPH_LAYOUT,GRAPH_EDGES); }

/* ---------------- 7. Merge Sort ---------------- */
function mergeSortBuild(){
  let arr = [8,3,7,4,9,2,6,1];
  const frames = [];
  function snap(range,action,note,cmp){
    frames.push({arr:[...arr],range,action,note,cmp:cmp||null});
  }
  function mergeSort(lo,hi){
    if(lo>=hi) return;
    const mid = Math.floor((lo+hi)/2);
    snap([lo,hi],'divide',`Divide [${lo}..${hi}] into [${lo}..${mid}] and [${mid+1}..${hi}].`);
    mergeSort(lo,mid);
    mergeSort(mid+1,hi);
    const left = arr.slice(lo,mid+1), right = arr.slice(mid+1,hi+1);
    let i=0,j=0,k=lo;
    while(i<left.length && j<right.length){
      snap([lo,hi],'compare',`Compare ${left[i]} and ${right[j]}.`,[lo+i,mid+1+j]);
      if(left[i]<=right[j]){ arr[k]=left[i]; i++; } else { arr[k]=right[j]; j++; }
      k++;
      snap([lo,hi],'place',`Place ${arr[k-1]} into position ${k-1}.`);
    }
    while(i<left.length){ arr[k]=left[i]; i++; k++; snap([lo,hi],'place',`Copy remaining ${arr[k-1]} into position ${k-1}.`); }
    while(j<right.length){ arr[k]=right[j]; j++; k++; snap([lo,hi],'place',`Copy remaining ${arr[k-1]} into position ${k-1}.`); }
    snap([lo,hi],'merged',`[${lo}..${hi}] is now sorted: ${arr.slice(lo,hi+1).join(', ')}.`);
  }
  mergeSort(0,arr.length-1);
  frames.push({arr:[...arr],range:[0,arr.length-1],action:'done',note:'Array fully sorted.'});
  frames.forEach(f=>{ f.line = f.action==='divide'?2 : f.action==='done'?6 : 5; });
  return {context:{}, frames};
}
function renderMergeSort(ctx,W,H,frame){
  const {arr,range,action,cmp} = frame;
  const n = arr.length;
  const max = Math.max(...arr);
  const bw = Math.min(52,(W-60)/n), gap = 10;
  const totalW = n*bw+(n-1)*gap;
  const startX = (W-totalW)/2;
  const baseY = H-50, maxBarH = H-110;
  if(range) label(ctx,W/2,26,`Working on range [${range[0]}..${range[1]}]`,{size:13,color:COLORS.dim});
  for(let i=0;i<n;i++){
    const x = startX+i*(bw+gap);
    const h = Math.max(20,(arr[i]/max)*maxBarH);
    const yy = baseY-h;
    const inRange = range && i>=range[0] && i<=range[1];
    let fill=COLORS.panel, stroke=COLORS.border;
    if(cmp && cmp.includes(i)){ fill='#301616'; stroke=COLORS.coral; }
    else if(action==='merged'||action==='done'){ if(inRange||action==='done'){ fill='#123832'; stroke=COLORS.teal; } }
    else if(inRange){ stroke=COLORS.amber; }
    roundRect(ctx,x,yy,bw,h,6);
    ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=stroke; ctx.stroke();
    label(ctx,x+bw/2,yy-14,String(arr[i]),{size:13,color:COLORS.text,weight:600});
    label(ctx,x+bw/2,baseY+16,String(i),{size:10,color:COLORS.dim});
  }
}

/* ---------------- 8. Hash Map — Two Sum ---------------- */
function hashMapBuild(){
  const arr = [2,7,11,15,3,6];
  const target = 17;
  const map = {};
  const frames = [];
  frames.push({i:-1,map:{...map},complement:null,found:false,note:`Use a hash map to find two numbers that add up to ${target}.`,line:1});
  for(let i=0;i<arr.length;i++){
    const complement = target-arr[i];
    const has = Object.prototype.hasOwnProperty.call(map,complement);
    frames.push({i,map:{...map},complement,found:has,note:`Need complement ${complement} for arr[${i}] = ${arr[i]}. ${has? `Found at index ${map[complement]}!` : 'Not in the map yet.'}`,line:4});
    if(has) break;
    map[arr[i]] = i;
    frames.push({i,map:{...map},complement:null,found:false,note:`Store arr[${i}] = ${arr[i]} → index ${i} in the map.`,line:5});
  }
  return {context:{arr,target}, frames};
}
function renderHashMap(ctx,W,H,frame,context){
  const {arr,target} = context;
  const n = arr.length;
  const cw = Math.min(56,(W*0.5-40)/n), gap = 8;
  const startX = 30, y = 56;
  label(ctx,startX,26,`Target = ${target}`,{size:13,color:COLORS.dim,align:'left'});
  for(let i=0;i<n;i++){
    const x = startX+i*(cw+gap);
    let fill=COLORS.panel, stroke=COLORS.border, tc=COLORS.text;
    if(i===frame.i){
      if(frame.found){ fill='#123832'; stroke=COLORS.teal; tc=COLORS.teal; }
      else { fill='#2a220f'; stroke=COLORS.amber; tc=COLORS.amber; }
    } else if(i<frame.i){ tc=COLORS.dim; }
    cell(ctx,x,y,cw,50,String(arr[i]),{fill,stroke,textColor:tc});
    label(ctx,x+cw/2,y+66,String(i),{size:10,color:COLORS.dim});
  }
  if(frame.complement!=null){
    label(ctx,startX,y+94,`need complement: ${frame.complement}`,{size:12,color: frame.found?COLORS.teal:COLORS.coral,align:'left'});
  }
  const mapX = W*0.58, mapY = 50;
  label(ctx,mapX,26,'hash map (value → index)',{size:11.5,color:COLORS.dim,align:'left'});
  Object.entries(frame.map).forEach(([k,v],idx)=>{
    const yy = mapY+idx*40;
    const highlighted = frame.found && Number(k)===frame.complement;
    cell(ctx,mapX,yy,124,32,`${k} → ${v}`,{fill: highlighted?'#123832':'#161b28', stroke: highlighted?COLORS.teal:COLORS.line, textColor: highlighted?COLORS.teal:COLORS.text});
  });
}

/* ---------------- app state & player ---------------- */
const state = { topic:null, modeKey:null, context:{}, frames:[], idx:0 };
let playing = false, timer = null;
const speedMs = [1600,1100,700,400];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function sizeCanvas(){
  const wrap = canvas.parentElement;
  const w = Math.max(280, wrap.clientWidth-20);
  const h = state.topic ? state.topic.height : 300;
  const dpr = window.devicePixelRatio||1;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  const topic = state.topic;
  const frame = state.frames[state.idx];
  if(!topic || !frame) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  topic.render(ctx,w,h,frame,state.context,state.modeKey);
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderCode(){
  const code = state.topic.code(state.modeKey);
  const block = document.getElementById('codeBlock');
  block.innerHTML = code.map((line,i)=>`<span class="ln" data-i="${i}">${escapeHtml(line)}</span>`).join('\n');
}
function highlightCode(){
  const frame = state.frames[state.idx];
  const code = state.topic.code(state.modeKey);
  const idx = Math.max(0, Math.min(frame.line ?? 0, code.length-1));
  document.querySelectorAll('#codeBlock .ln').forEach(el=>{
    el.classList.toggle('active', Number(el.dataset.i)===idx);
  });
}
function renderTape(){
  const tape = document.getElementById('tape');
  tape.innerHTML = '';
  state.frames.forEach((f,i)=>{
    const d = document.createElement('div');
    d.className = 'tape-tick'+(i===state.idx?' active':(i<state.idx?' past':''));
    d.title = 'Step '+(i+1);
    d.addEventListener('click', ()=>{ pause(); state.idx=i; update(); });
    tape.appendChild(d);
  });
}
function update(){
  if(!state.frames.length) return;
  draw();
  const f = state.frames[state.idx];
  document.getElementById('frameNote').textContent = f.note||'';
  document.getElementById('stepCounter').textContent = `Step ${state.idx+1} / ${state.frames.length}`;
  highlightCode();
  document.querySelectorAll('.tape-tick').forEach((el,i)=>{
    el.className = 'tape-tick'+(i===state.idx?' active':(i<state.idx?' past':''));
  });
  document.getElementById('btnPlay').textContent = playing? '⏸ Pause':'▶ Play';
  document.getElementById('btnPrev').disabled = state.idx===0;
  document.getElementById('btnNext').disabled = state.idx===state.frames.length-1;
}
function play(){
  if(state.idx>=state.frames.length-1) state.idx=0;
  playing = true;
  const speed = Number(document.getElementById('speedRange').value);
  clearInterval(timer);
  timer = setInterval(()=>{
    if(state.idx>=state.frames.length-1){ pause(); return; }
    state.idx++; update();
  }, speedMs[speed-1]);
  update();
}
function pause(){ playing=false; clearInterval(timer); update(); }
function togglePlay(){ playing? pause() : play(); }
function next(){ pause(); if(state.idx<state.frames.length-1){ state.idx++; update(); } }
function prev(){ pause(); if(state.idx>0){ state.idx--; update(); } }
function resetTopic(){ pause(); state.idx=0; update(); }

function loadTopic(id, modeKey){
  pause();
  const topic = TOPICS.find(t=>t.id===id);
  state.topic = topic;
  state.modeKey = modeKey || (topic.modes ? topic.modes[0].key : null);
  const built = topic.build(state.modeKey);
  state.context = built.context||{};
  state.frames = built.frames;
  state.idx = 0;

  document.getElementById('stageTitle').textContent = topic.title;
  document.getElementById('stageTag').textContent = topic.tag;
  document.getElementById('stageLevel').textContent = topic.level;
  document.getElementById('stageBlurb').textContent = topic.blurb;

  const modeRow = document.getElementById('modeRow');
  modeRow.innerHTML = '';
  if(topic.modes){
    modeRow.style.display = 'flex';
    topic.modes.forEach(m=>{
      const b = document.createElement('button');
      b.className = 'mode-btn'+(m.key===state.modeKey?' active':'');
      b.textContent = m.label;
      b.addEventListener('click', ()=> loadTopic(id, m.key));
      modeRow.appendChild(b);
    });
  } else {
    modeRow.style.display = 'none';
  }

  document.querySelectorAll('.topic-btn').forEach(el=>{
    el.classList.toggle('active', el.dataset.id===id);
  });

  sizeCanvas();
  renderCode();
  renderTape();
  update();
}
