server {
    listen $PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript text/plain;
    gzip_min_length 1024;

    # Explicit routes for each HTML file
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /dsa-animator.html {
        try_files /dsa-animator.html =404;
    }

    location = /system-design.html {
        try_files /system-design.html =404;
    }

    # Health check endpoint for Railway
    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Fallback — serve index.html for any other path
    location / {
        try_files $uri /index.html;
    }
}
