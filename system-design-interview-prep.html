<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design - Reference</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --surface: #161d24;
            --surface2: #1b242d;
            --line: #2a3641;
            --line2: #3a4854;
            --ink: #e6edf3;
            --mut: #9fb0bf;
            --faint: #71828f;
            --a1: #7aa2f7;
            --a2: #9ece6a;
            --a3: #e0af68;
            --a4: #bb9af7;
            --a5: #7dcfff;
            --warn: #f7768e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--surface);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--line);
        }

        .nav-links {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .nav-pill {
            font-size: 12px;
            text-decoration: none;
            color: var(--mut);
            background: var(--surface2);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--line);
            transition: all 0.2s ease;
        }

        .nav-pill:hover {
            color: var(--ink);
            border-color: var(--line2);
            background: var(--line);
        }

        .sidebar h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--ink);
        }

        .sidebar p {
            font-size: 13px;
            color: var(--faint);
        }

        .topic-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }

        .topic-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            color: var(--mut);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topic-btn:hover {
            background: var(--surface2);
            color: var(--ink);
        }

        .topic-btn.active {
            background: var(--surface2);
            border-color: var(--line);
            color: var(--ink);
        }

        .topic-name {
            font-size: 14px;
            font-weight: 500;
        }

        .topic-cat {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg);
            color: var(--faint);
            font-family: 'IBM Plex Mono', monospace;
        }

        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .main-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 20, 25, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .main-title {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cat-badge {
            font-size: 12px;
            font-family: 'IBM Plex Mono', monospace;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--surface2);
            border: 1px solid var(--line);
            color: var(--a5);
        }

        .content {
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Canvas Section */
        .canvas-container {
            background: #0b1016;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--surface);
            border-top: 1px solid var(--line);
        }

        .step-info {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--mut);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--surface2);
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--line);
            border-color: var(--line2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .explanation {
            font-size: 15px;
            line-height: 1.5;
            color: var(--ink);
            padding: 16px 20px;
            background: rgba(122, 162, 247, 0.1);
            border-left: 3px solid var(--a1);
            margin-bottom: 40px;
            border-radius: 0 8px 8px 0;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px;
        }

        .panel h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--a5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel ul {
            list-style: none;
        }

        .panel li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--mut);
        }

        .panel li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--a1);
            font-weight: bold;
        }

        .numbers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .number-pill {
            background: var(--surface2);
            border: 1px solid var(--line);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--a3);
            display: flex;
            flex-direction: column;
        }
        
        .number-pill span {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            color: var(--faint);
            margin-top: 2px;
        }

        /* Tradeoffs */
        .tradeoffs {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .tradeoff {
            flex: 1;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .tradeoff.gain {
            background: rgba(158, 206, 106, 0.05);
            border-color: rgba(158, 206, 106, 0.2);
        }

        .tradeoff.cost {
            background: rgba(247, 118, 142, 0.05);
            border-color: rgba(247, 118, 142, 0.2);
        }
        
        .icon-gain { color: var(--a2); font-weight: bold; }
        .icon-cost { color: var(--warn); font-weight: bold; }

        /* Questions */
        .questions {
            margin-bottom: 60px;
        }

        .q-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--mut);
        }

        .q-item strong {
            color: var(--ink);
            display: block;
            margin-bottom: 4px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="nav-links">
                <a href="index.html" class="nav-pill">← Home</a>
                <a href="dsa-animator.html" class="nav-pill">DSA Animator →</a>
            </div>
            <h1>System Design</h1>
            <p>Senior SWE Interview Reference</p>
        </div>
        <div class="topic-list" id="topicList">
            <!-- Topics rendered here -->
        </div>
    </div>

    <div class="main-area">
        <div class="main-header">
            <div class="main-title">
                <span id="titleText">Topic Name</span>
                <span class="cat-badge" id="catBadge">Category</span>
            </div>
        </div>

        <div class="content">
            <div class="canvas-container">
                <canvas id="canvas" width="900" height="340"></canvas>
                <div class="controls">
                    <div class="step-info" id="stepInfo">Step 1 of 5</div>
                    <div class="btn-group">
                        <button class="btn" id="btnPrev">← Prev</button>
                        <button class="btn" id="btnNext">Next →</button>
                    </div>
                </div>
            </div>

            <div class="explanation" id="explanation">
                Explanation text goes here.
            </div>

            <div class="tradeoffs" id="tradeoffs">
                <div class="tradeoff gain">
                    <span class="icon-gain">✓</span>
                    <div>
                        <strong style="color:var(--ink)">Gain</strong><br>
                        <span id="tradeGain" style="color:var(--mut)">...</span>
                    </div>
                </div>
                <div class="tradeoff cost">
                    <span class="icon-cost">✗</span>
                    <div>
                        <strong style="color:var(--ink)">Cost</strong><br>
                        <span id="tradeCost" style="color:var(--mut)">...</span>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <div class="panel">
                    <h3>Key Concepts</h3>
                    <ul id="conceptsList">
                    </ul>
                </div>
                <div class="panel">
                    <h3>Key Numbers</h3>
                    <div class="numbers-list" id="numbersList">
                    </div>
                </div>
            </div>

            <div class="questions" id="questions">
                <h3 style="margin-bottom:16px;font-size:18px;">Common Interview Questions</h3>
                <div id="qList"></div>
            </div>
        </div>
    </div>

<script>
const BG='#0b1016', SURF='#161d24', SURF2='#1b242d';
const BLUE='#7aa2f7', GREEN='#9ece6a', AMBER='#e0af68', PURPLE='#bb9af7', CYAN='#7dcfff', RED='#f7768e', DIM='#71828f', INK='#e6edf3', LINE='#3a4854';

function rbox(ctx,x,y,w,h,fill,stroke,r=10){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
    ctx.fillStyle=fill; ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}
}
function lbl(ctx,s,x,y,size=13,color=INK,align='center',bold=false){
    ctx.fillStyle=color;
    ctx.font=(bold?'600 ':'400 ')+size+'px "Outfit",-apple-system,sans-serif';
    ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillText(s,x,y);
}
function arrow(ctx,x1,y1,x2,y2,color=DIM,label=''){
    ctx.save();
    ctx.strokeStyle=color; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const ang=Math.atan2(y2-y1,x2-x1);
    ctx.fillStyle=color;
    ctx.translate(x2,y2); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-9,-4); ctx.lineTo(-9,4); ctx.closePath(); ctx.fill();
    ctx.restore();
    if(label){
        const mx=(x1+x2)/2, my=(y1+y2)/2 - 12;
        ctx.fillStyle=color;
        ctx.font='11px "IBM Plex Mono",monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(label,mx,my);
    }
}
function box(ctx,x,y,w,h,label,fill,stroke,sublabel=''){
    rbox(ctx,x,y,w,h,fill,stroke);
    lbl(ctx,label,x+w/2,y+(sublabel?h/2-8:h/2),13,INK,'center',true);
    if(sublabel) {
        ctx.fillStyle=DIM;
        ctx.font='11px "IBM Plex Mono",monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(sublabel,x+w/2,y+h/2+9);
    }
}
function dbCyl(ctx,x,y,w,h,label,fill,stroke){
    ctx.fillStyle=fill;
    ctx.beginPath(); ctx.ellipse(x+w/2,y+10,w/2,10,0,0,Math.PI*2); ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}
    ctx.fillRect(x,y+10,w,h-20);
    if(stroke){
        ctx.beginPath(); ctx.moveTo(x,y+10); ctx.lineTo(x,y+h-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+w,y+10); ctx.lineTo(x+w,y+h-10); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(x+w/2,y+h-10,w/2,10,0,0,Math.PI); ctx.fill();
    if(stroke){ctx.stroke();}
    lbl(ctx,label,x+w/2,y+h/2,13,INK,'center',true);
}

const TOPICS = [
    {
        id: 'url', name: 'URL Shortener', cat: 'Classic',
        concepts: ['Base62 Encoding (A-Z, a-z, 0-9)', 'Hash collision handling', 'Custom aliases support', '301 (Permanent) vs 302 (Temporary) redirects', 'Analytics tracking & Rate Limiting'],
        questions: ['How to handle 100M URLs/day?', 'How to ensure uniqueness across distributed servers?', 'How to support custom aliases?'],
        numbers: [{v:'100M',l:'URLs/day'}, {v:'10:1',l:'Read:Write'}, {v:'100GB',l:'Storage/yr'}],
        tradeoffs: { gain: 'Scalable reads and fast redirects with Redis.', cost: 'Storage growth over time; DB bottleneck on massive hash collisions.' },
        build: () => {
            return [
                { step:1, msg:"1. Client submits a long URL to shorten.", show:['client','api','arr1'] },
                { step:2, msg:"2. API Server asks ID Generator for a unique sequence.", show:['client','api','arr1','idgen','arr2'] },
                { step:3, msg:"3. Store mapping (short, long) in Database.", show:['client','api','arr1','idgen','arr2','db','arr3'] },
                { step:4, msg:"4. Cache the mapping in Redis for fast reads.", show:['client','api','arr1','idgen','arr2','db','arr3','cache','arr4'] },
                { step:5, msg:"5. On redirect, fetch from Cache and return 301/302.", show:['client','api','arr1','idgen','arr2','db','arr3','cache','arr4','arr5'] }
            ];
        },
        render: (ctx, fr, s) => {
            const sh = (id) => fr.show.includes(id);
            if(sh('client')) box(ctx, 50, 140, 100, 60, 'Client', SURF2, LINE);
            if(sh('api')) box(ctx, 250, 140, 120, 60, 'API Server', SURF2, BLUE);
            if(sh('arr1')) arrow(ctx, 150, 170, 250, 170, DIM, 'POST /create');
            if(sh('idgen')) box(ctx, 450, 60, 120, 50, 'ID Gen', SURF2, AMBER, 'Base62');
            if(sh('arr2')) arrow(ctx, 310, 140, 450, 90, DIM, 'get ID');
            if(sh('db')) dbCyl(ctx, 450, 220, 120, 70, 'Database', SURF2, GREEN);
            if(sh('arr3')) arrow(ctx, 370, 180, 450, 240, DIM, 'insert');
            if(sh('cache')) box(ctx, 500, 140, 120, 50, 'Redis', SURF2, RED, 'Cache');
            if(sh('arr4')) arrow(ctx, 370, 170, 500, 170, DIM, 'set');
            if(sh('arr5')) arrow(ctx, 250, 190, 150, 190, GREEN, '302 Redirect');
        }
    },
    {
        id: 'ratelimit', name: 'Rate Limiter', cat: 'Infrastructure',
        concepts: ['Algorithms: Token Bucket, Sliding Window Log, Fixed Window', 'Distributed Rate Limiting via Redis INCR + EXPIRE', 'Header conventions (X-RateLimit-Remaining)', 'Where to place: Client vs Gateway vs Server'],
        questions: ['How to rate limit distributed across 3 servers?', 'Token bucket vs sliding window tradeoffs?', 'How to handle bursty traffic?'],
        numbers: [{v:'100K',l:'Ops/sec Redis'}, {v:'10M',l:'Users capacity'}, {v:'<1ms',l:'Overhead'}],
        tradeoffs: { gain: 'Protects backend from DDoS and abusive scraping.', cost: 'Adds latency to every request; Redis becomes a critical dependency.' },
        build: () => {
            return [
                { step:1, msg:"1. Client request arrives at API Gateway.", show:['client','gw','arr1'] },
                { step:2, msg:"2. Gateway checks Rate Limiter middleware.", show:['client','gw','arr1','rl'] },
                { step:3, msg:"3. Rate Limiter queries Redis for current token count.", show:['client','gw','arr1','rl','redis','arr2'] },
                { step:4, msg:"4. If allowed, request forwarded to Backend.", show:['client','gw','arr1','rl','redis','arr2','back','arr3'] },
                { step:5, msg:"5. If blocked, returns 429 Too Many Requests.", show:['client','gw','arr1','rl','redis','arr2','back','arr3','arr4'] }
            ];
        },
        render: (ctx, fr) => {
            const sh = (id) => fr.show.includes(id);
            if(sh('client')) box(ctx, 50, 140, 100, 60, 'Client', SURF2, LINE);
            if(sh('gw')) box(ctx, 250, 100, 140, 140, 'API Gateway', SURF, LINE);
            if(sh('arr1')) arrow(ctx, 150, 170, 250, 170, DIM, 'Request');
            if(sh('rl')) box(ctx, 270, 150, 100, 40, 'Rate Limiter', SURF2, BLUE);
            if(sh('redis')) dbCyl(ctx, 260, 280, 120, 50, 'Redis', SURF2, RED);
            if(sh('arr2')) arrow(ctx, 320, 190, 320, 280, DIM, 'Check & INCR');
            if(sh('back')) box(ctx, 550, 140, 120, 60, 'Backend', SURF2, GREEN);
            if(sh('arr3')) arrow(ctx, 390, 170, 550, 170, GREEN, 'Allow');
            if(sh('arr4')) arrow(ctx, 250, 190, 150, 190, RED, '429 Block');
        }
    },
    {
        id: 'consistent', name: 'Consistent Hashing', cat: 'Distributed',
        concepts: ['Hash Ring mapping keys and nodes', 'Virtual Nodes (150-200 per physical server)', 'Minimizes key redistribution on scaling', 'Prevents hot spots in distributed caches'],
        questions: ['What happens when a node fails?', 'Why use virtual nodes?', 'How does modulo hashing fail at scale?'],
        numbers: [{v:'1/N',l:'Keys moved'}, {v:'~200',l:'VNodes/Server'}, {v:'O(log N)',l:'Lookup'}],
        tradeoffs: { gain: 'Smooth scaling without massive cache invalidation.', cost: 'Slightly more complex routing logic and metadata management.' },
        build: () => {
            return [
                { step:1, msg:"1. A hash space represented as a ring (0 to 2^32-1).", show:['ring'] },
                { step:2, msg:"2. Physical Nodes A, B, C placed on ring via hash(IP).", show:['ring','nodes'] },
                { step:3, msg:"3. Keys mapped to nearest node clockwise.", show:['ring','nodes','keys'] },
                { step:4, msg:"4. Adding Node D only remaps keys from C to D.", show:['ring','nodes','keys','nodeD'] },
                { step:5, msg:"5. Virtual nodes distribute load evenly.", show:['ring','nodes','keys','nodeD','vnodes'] }
            ];
        },
        render: (ctx, fr) => {
            const sh = (id) => fr.show.includes(id);
            const cx=450, cy=170, r=120;
            if(sh('ring')){
                ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
                ctx.strokeStyle=LINE; ctx.lineWidth=3; ctx.stroke();
            }
            const drawNode = (ang, label, color) => {
                const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
                ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
                lbl(ctx,label,x + (Math.cos(ang)*20), y + (Math.sin(ang)*20), 14, color, 'center', true);
            };
            const drawKey = (ang, label) => {
                const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
                ctx.beginPath(); ctx.rect(x-5,y-5,10,10); ctx.fillStyle=AMBER; ctx.fill();
                lbl(ctx,label,x - (Math.cos(ang)*20), y - (Math.sin(ang)*20), 11, AMBER);
            };
            if(sh('nodes')){ drawNode(0, 'A', BLUE); drawNode(Math.PI*2/3, 'B', BLUE); drawNode(Math.PI*4/3, 'C', BLUE); }
            if(sh('keys')){ drawKey(0.5, 'k1'); drawKey(2.5, 'k2'); drawKey(4.5, 'k3'); }
            if(sh('nodeD')){
                drawNode(Math.PI*5/3, 'D', GREEN);
                arrow(ctx, cx + (r-30)*Math.cos(5), cy + (r-30)*Math.sin(5), cx + r*Math.cos(Math.PI*5/3)-10, cy + r*Math.sin(Math.PI*5/3)-10, GREEN);
            }
            if(sh('vnodes')){
                for(let i=0; i<12; i++){
                    const ang = i*Math.PI/6 + 0.1;
                    const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
                    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle=DIM; ctx.fill();
                }
            }
        }
    },
    {
        id: 'loadbalancer', name: 'Load Balancer', cat: 'Infrastructure',
        concepts: ['L4 (Transport) vs L7 (Application) routing', 'Algorithms: Round Robin, Least Conn, IP Hash', 'Active Health Checks', 'Sticky Sessions / Session Affinity', 'Active-Passive HA setup'],
        questions: ['How to maintain sessions across multiple servers?', 'L4 vs L7 tradeoffs?', 'How do you avoid the LB becoming a single point of failure?'],
        numbers: [{v:'1M+',l:'Req/sec'}, {v:'5-30s',l:'Health Checks'}, {v:'Layer 4/7',l:'Routing'}],
        tradeoffs: { gain: 'High availability and horizontal scalability.', cost: 'LB itself is a potential bottleneck/SPOF if not clustered.' },
        build: () => {
            return [
                { step:1, msg:"1. Clients send requests to a single IP.", show:['clients','arr1'] },
                { step:2, msg:"2. Load Balancer receives traffic.", show:['clients','arr1','lb'] },
                { step:3, msg:"3. LB periodically health-checks backends.", show:['clients','arr1','lb','servers','hc'] },
                { step:4, msg:"4. LB routes to Server 1 via algorithm (e.g. Least Conn).", show:['clients','arr1','lb','servers','hc','route1'] },
                { step:5, msg:"5. Next request goes to Server 2.", show:['clients','arr1','lb','servers','hc','route1','route2'] }
            ];
        },
        render: (ctx, fr) => {
            const sh = (id) => fr.show.includes(id);
            if(sh('clients')){
                box(ctx, 40, 100, 80, 40, 'Client 1', SURF2, LINE);
                box(ctx, 40, 200, 80, 40, 'Client 2', SURF2, LINE);
            }
            if(sh('arr1')){

let cur = TOPICS[0], frames = cur.build(), idx = 0;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function renderUI() {
    // Sidebar
    const list = document.getElementById('topicList');
    list.innerHTML = '';
    TOPICS.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'topic-btn' + (t.id === cur.id ? ' active' : '');
        btn.innerHTML = `<span class="topic-name">${t.name}</span><span class="topic-cat">${t.cat}</span>`;
        btn.onclick = () => setTopic(t);
        list.appendChild(btn);
    });

    // Header
    document.getElementById('titleText').innerText = cur.name;
    document.getElementById('catBadge').innerText = cur.cat;

    // Data
    document.getElementById('conceptsList').innerHTML = cur.concepts.map(c => `<li>${c}</li>`).join('');
    document.getElementById('numbersList').innerHTML = cur.numbers.map(n => `<div class="number-pill">${n.v}<span>${n.l}</span></div>`).join('');
    document.getElementById('qList').innerHTML = cur.questions.map(q => `<div class="q-item"><strong>Q:</strong> ${q}</div>`).join('');
    
    document.getElementById('tradeGain').innerText = cur.tradeoffs.gain;
    document.getElementById('tradeCost').innerText = cur.tradeoffs.cost;

    renderCanvas();
}

function setTopic(t) {
    cur = t;
    frames = cur.build();
    idx = 0;
    history.replaceState(null, '', '?topic=' + t.id);
    renderUI();
}

function renderCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const fr = frames[idx];
    document.getElementById('stepInfo').innerText = `Step ${idx + 1} of ${frames.length}`;
    document.getElementById('explanation').innerText = fr.msg;
    
    document.getElementById('btnPrev').disabled = (idx === 0);
    document.getElementById('btnNext').disabled = (idx === frames.length - 1);

    cur.render(ctx, fr);
}

document.getElementById('btnPrev').onclick = () => { if(idx > 0) { idx--; renderCanvas(); } };
document.getElementById('btnNext').onclick = () => { if(idx < frames.length - 1) { idx++; renderCanvas(); } };

// Init
const params = new URLSearchParams(window.location.search);
if(params.has('topic')){
    const t = TOPICS.find(x => x.id === params.get('topic'));
    if(t) cur = t;
}
frames = cur.build();
renderUI();
