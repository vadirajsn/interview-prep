<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design — Interview Blueprint</title>
<style>
  :root{
    --bg:#0B1D33;
    --bg2:#0E2440;
    --grid:#16304F;
    --ink:#E8EDF4;
    --ink-dim:#8FA5C0;
    --amber:#FFB020;
    --cyan:#5EEAD4;
    --red:#FF6B6B;
    --panel:#0F2645;
    --panel-border:#1F3F66;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ===== Header ===== */
  header{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--panel-border);
    background:rgba(11,29,51,0.85);
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:50;
  }
  .brand{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .brand .mark{
    font-family:var(--mono); font-size:13px; color:var(--amber);
    border:1px solid var(--amber); padding:2px 8px; border-radius:3px;
    letter-spacing:0.08em;
  }
  h1{
    font-size:26px; margin:6px 0 4px; font-weight:700; letter-spacing:-0.01em;
  }
  header p.sub{ margin:0; color:var(--ink-dim); font-size:14px; font-family:var(--mono);}

  /* ===== Layout ===== */
  .shell{ display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 96px);}
  nav{
    border-right:1px solid var(--panel-border);
    padding:20px 12px;
    position:sticky; top:96px; align-self:start;
    max-height:calc(100vh - 96px); overflow-y:auto;
  }
  nav .grp-label{
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:0.1em; margin:16px 8px 6px;
  }
  nav button{
    display:block; width:100%; text-align:left;
    background:transparent; border:none; color:var(--ink-dim);
    font-family:var(--sans); font-size:14px; padding:9px 10px;
    border-radius:6px; cursor:pointer; margin-bottom:2px;
    border-left:2px solid transparent;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  nav button .num{ font-family:var(--mono); color:var(--cyan); margin-right:8px; font-size:12px;}
  nav button:hover{ background:var(--panel); color:var(--ink);}
  nav button.active{
    background:var(--panel); color:var(--ink); border-left-color:var(--amber);
    font-weight:600;
  }

  main{ padding:32px 40px 80px; max-width:980px;}
  section.topic{ display:none; }
  section.topic.active{ display:block; animation:fadein 0.25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .topic-head{ margin-bottom:18px; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; color:var(--amber);
    letter-spacing:0.08em; text-transform:uppercase;
  }
  .topic h2{ font-size:28px; margin:4px 0 8px; }
  .topic .dek{ color:var(--ink-dim); font-size:15px; line-height:1.5; max-width:640px;}

  .stage{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:18px; margin:20px 0 8px;
    position:relative;
  }
  .stage-controls{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:var(--mono); font-size:12px; background:var(--bg2);
    color:var(--cyan); border:1px solid var(--panel-border);
    padding:7px 14px; border-radius:6px; cursor:pointer;
    letter-spacing:0.03em; transition:all .15s;
  }
  .btn:hover{ border-color:var(--cyan); background:#123055; }
  .btn.primary{ background:var(--amber); color:#111; border-color:var(--amber); font-weight:700;}
  .btn.primary:hover{ filter:brightness(1.08); }
  .status-line{
    font-family:var(--mono); font-size:12px; color:var(--ink-dim);
    margin-left:auto;
  }
  svg{ display:block; width:100%; height:auto; }

  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--ink-dim);}
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:22px; }
  @media (max-width:760px){ .grid2{grid-template-columns:1fr;} .shell{grid-template-columns:1fr;} nav{position:relative; top:0; max-height:none; border-right:none; border-bottom:1px solid var(--panel-border);} }

  .card{
    background:var(--bg2); border:1px solid var(--panel-border);
    border-radius:8px; padding:16px 18px;
  }
  .card h3{ margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--cyan); font-family:var(--mono);}
  .card ul{ margin:0; padding-left:18px; color:var(--ink); font-size:14px; line-height:1.65;}
  .card ul li::marker{ color:var(--amber); }

  .talk-track{
    margin-top:22px; border-top:1px dashed var(--panel-border); padding-top:16px;
  }
  .talk-track h3{ font-family:var(--mono); font-size:13px; color:var(--amber); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px;}
  .talk-track ol{ margin:0; padding-left:20px; color:var(--ink); font-size:14.5px; line-height:1.7;}
  .talk-track ol li::marker{ color:var(--cyan); font-family:var(--mono); }

  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .pill{
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    border:1px solid var(--panel-border); padding:4px 10px; border-radius:999px;
  }

  footer{
    border-top:1px solid var(--panel-border); padding:20px 40px;
    color:var(--ink-dim); font-family:var(--mono); font-size:12px;
  }

  /* small utility text styles used inside svgs via foreignObject not needed; use <text> */
  text{ font-family:var(--mono); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">SD // PREP</span>
  </div>
  <h1>System Design — Interview Blueprint</h1>
  <p class="sub">10 patterns, animated · click a topic, hit Run</p>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<footer>Built for interview prep — walk through the animation, then rehearse the talk track out loud.</footer>

<script>
// ============ BODIES: each returns HTML string incl. inline SVG + controls ============
const BODIES = {

lb: () => `
<div class="stage">
  <div class="stage-controls">
    <button class="btn primary" onclick="lbRun()">Run</button>
    <button class="btn" onclick="lbFail()">Fail Server 2</button>

  </div>
  <svg viewBox="0 0 760 260" id="lb-svg">
    <text x="40" y="30" fill="#8FA5C0" font-size="12">clients</text>
    <circle cx="55" cy="60" r="10" fill="#5EEAD4"/>
    <circle cx="55" cy="120" r="10" fill="#5EEAD4"/>
    <circle cx="55" cy="180" r="10" fill="#5EEAD4"/>

    <rect x="220" y="90" width="90" height="60" rx="8" fill="#0E2440" stroke="#FFB020" stroke-width="2"/>
    <text x="235" y="125" fill="#FFB020" font-size="12">LB</text>

    <g id="lb-servers">
      <rect x="480" y="30" width="120" height="55" rx="6" fill="#0E2440" stroke="#1F3F66" stroke-width="2" id="lb-s1"/>
      <text x="495" y="62" fill="#E8EDF4" font-size="12">Server 1</text>
      <rect x="480" y="102" width="120" height="55" rx="6" fill="#0E2440" stroke="#1F3F66" stroke-width="2" id="lb-s2"/>
      <text x="495" y="134" fill="#E8EDF4" font-size="12">Server 2</text>
      <rect x="480" y="174" width="120" height="55" rx="6" fill="#0E2440" stroke="#1F3F66" stroke-width="2" id="lb-s3"/>
      <text x="495" y="206" fill="#E8EDF4" font-size="12">Server 3</text>
    </g>

    <line x1="65" y1="60" x2="220" y2="115" stroke="#1F3F66"/>
    <line x1="65" y1="120" x2="220" y2="120" stroke="#1F3F66"/>
    <line x1="65" y1="180" x2="220" y2="125" stroke="#1F3F66"/>
    <line x1="310" y1="110" x2="480" y2="57" stroke="#1F3F66"/>
    <line x1="310" y1="120" x2="480" y2="129" stroke="#1F3F66"/>
    <line x1="310" y1="130" x2="480" y2="201" stroke="#1F3F66"/>

    <g id="lb-packets"></g>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#5EEAD4"></span> request</span>
    <span><span class="dot" style="background:#FFB020"></span> load balancer</span>
    <span><span class="dot" style="background:#FF6B6B"></span> unhealthy node</span>
  </div>
</div>
${grid2Cards(
  ['Algorithms', ['Round robin — simplest, equal weight','Least connections — best for uneven request costs','Weighted round robin — heterogeneous hardware','Consistent hashing — sticky sessions, cache locality']],
  ['Health checks', ['LB polls /health every few seconds','Failed node pulled from rotation instantly','Traffic reroutes to remaining healthy nodes','Node re-added once checks pass again']]
)}
${talkTrack([
  'Clarify: L4 (TCP, fast) vs L7 (HTTP-aware, routes on path/header) — pick based on whether you need content-based routing.',
  'Name the algorithm and why: round robin for uniform requests, least-connections when request cost varies widely.',
  'Bring up health checks and how failure detection removes a node without dropping in-flight-safe traffic (graceful drain).',
  'Mention LB itself is a single point of failure — pair with a floating IP / DNS failover or run active-active LBs.'
])}`,

cache: () => `
<div class="stage">
  <div class="stage-controls">
    <button class="btn primary" onclick="cacheRun('miss')">Run: Cache Miss</button>
    <button class="btn" onclick="cacheRun('hit')">Run: Cache Hit</button>
    <button class="btn" onclick="cacheReset()">Reset</button>
    <span class="status-line" id="cache-status">idle</span>
  </div>
  <svg viewBox="0 0 760 200" id="cache-svg">
    <circle cx="50" cy="100" r="12" fill="#5EEAD4"/>
    <text x="30" y="130" fill="#8FA5C0" font-size="12">client</text>

    <rect x="260" y="60" width="120" height="80" rx="8" fill="#0E2440" stroke="#1F3F66" stroke-width="2" id="cache-box"/>
    <text x="285" y="105" fill="#E8EDF4" font-size="13">Cache</text>

    <rect x="560" y="60" width="120" height="80" rx="8" fill="#0E2440" stroke="#1F3F66" stroke-width="2" id="db-box"/>
    <text x="590" y="105" fill="#E8EDF4" font-size="13">DB</text>

    <line x1="62" y1="100" x2="260" y2="100" stroke="#1F3F66"/>
    <line x1="380" y1="100" x2="560" y2="100" stroke="#1F3F66" id="cache-to-db-line"/>

    <g id="cache-packets"></g>
    <text id="cache-label" x="380" y="180" fill="#8FA5C0" font-size="12" text-anchor="middle"></text>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#5EEAD4"></span> request path</span>
    <span><span class="dot" style="background:#FFB020"></span> populate cache</span>
  </div>
</div>
${grid2Cards(
  ['Eviction & TTL', ['LRU — evict least-recently-used when full','TTL — expire stale data automatically','Write-through — write to cache + DB together','Write-behind — write to cache, flush to DB async']],
  ['Failure modes', ['Thundering herd — many misses hit DB at once on expiry','Cache stampede fix: lock / request coalescing, jittered TTL','Stale reads — acceptable for most, not for balances','Cache-aside is most common: app owns the miss-fill logic']]
)}
${talkTrack([
  'State the pattern by name: cache-aside (lazy load) is the default unless the interviewer asks for write-through.',
  'Walk the miss path out loud: check cache → miss → read DB → populate cache → return. Then the hit path: single hop.',
  'Raise invalidation explicitly — "the hard problem in caching is invalidation, not lookup" — TTL vs explicit invalidate on write.',
  'If asked about consistency: cache-aside can serve stale data between a DB write and the next read; that’s often an acceptable trade for latency.'
])}`,

cdn: () => `
<div class="stage">
  <div class="stage-controls">
    <button class="btn primary" onclick="cdnRun('hit')">Run: Edge Hit</button>
    <button class="btn" onclick="cdnRun('miss')">Run: Edge Miss</button>
    <button class="btn" onclick="cdnReset()">Reset</button>
    <span class="status-line" id="cdn-status">idle</span>
  </div>
  <svg viewBox="0 0 760 220" id="cdn-svg">
    <circle cx="50" cy="110" r="12" fill="#5EEAD4"/>
    <text x="15" y="140" fill="#8FA5C0" font-size="12">user</text>

    <rect x="260" y="70" width="130" height="80" rx="8" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
    <text x="280" y="105" fill="#E8EDF4" font-size="13">Edge node</text>
    <text x="280" y="125" fill="#8FA5C0" font-size="11">(nearest PoP)</text>

    <rect x="580" y="70" width="130" height="80" rx="8" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
    <text x="605" y="105" fill="#E8EDF4" font-size="13">Origin</text>
    <text x="600" y="125" fill="#8FA5C0" font-size="11">(your server)</text>

    <line x1="62" y1="110" x2="260" y2="110" stroke="#1F3F66"/>
    <line x1="390" y1="110" x2="580" y2="110" stroke="#1F3F66" stroke-dasharray="4 4"/>
    <g id="cdn-packets"></g>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#5EEAD4"></span> user request</span>
    <span><span class="dot" style="background:#FF6B6B"></span> origin round-trip (only on miss)</span>
  </div>
</div>
${grid2Cards(
  ['What belongs on a CDN', ['Static assets: JS, CSS, images, video','API responses that are cacheable & public','Not: per-user dynamic data, write requests','TTL headers (Cache-Control) drive edge freshness']],
  ['Invalidation', ['Purge/invalidate API to force-evict an edge object','Versioned filenames (app.a1b2.js) avoid purge entirely','Stale-while-revalidate: serve stale, refresh in background','Geographic PoPs cut latency by serving near the user']]
)}
${talkTrack([
  'Frame the win as latency + origin offload: most requests never leave the edge, so origin only handles cold content and writes.',
  'Distinguish push CDN (you upload) vs pull CDN (origin-fetch-on-miss, more common) — mention pull is the default for most setups.',
  'Bring up cache-busting via versioned filenames as the clean answer to "how do you invalidate" instead of relying only on purge APIs.',
  'If the question is about dynamic content, note CDNs now cache personalized/API responses too, with short TTLs and stale-while-revalidate.'
])}`,

rate: () => `
<div class="stage">
  <div class="stage-controls">
    <button class="btn primary" onclick="rateRun()">Start bucket</button>
    <button class="btn" onclick="rateBurst()">Burst 6 requests</button>
    <button class="btn" onclick="rateReset()">Reset</button>
    <span class="status-line" id="rate-status">idle</span>
  </div>
  <svg viewBox="0 0 760 220" id="rate-svg">
    <text x="20" y="30" fill="#8FA5C0" font-size="12">Token bucket (capacity 5, refill 1/sec)</text>
    <rect x="40" y="50" width="90" height="120" rx="10" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
    <g id="rate-tokens"></g>
    <text x="40" y="188" fill="#8FA5C0" font-size="11">tokens: <tspan id="rate-count">0</tspan>/5</text>

    <rect x="300" y="90" width="110" height="50" rx="8" fill="#0E2440" stroke="#FFB020" stroke-width="2"/>
    <text x="320" y="120" fill="#FFB020" font-size="12">Limiter</text>

    <rect x="560" y="90" width="120" height="50" rx="8" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
    <text x="585" y="120" fill="#E8EDF4" font-size="12">Service</text>

    <line x1="130" y1="115" x2="300" y2="115" stroke="#1F3F66"/>
    <line x1="410" y1="115" x2="560" y2="115" stroke="#1F3F66"/>

    <g id="rate-packets"></g>
    <g id="rate-rejects"></g>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#FFB020"></span> token</span>
    <span><span class="dot" style="background:#5EEAD4"></span> allowed request</span>
    <span><span class="dot" style="background:#FF6B6B"></span> rejected (429)</span>
  </div>
</div>
${grid2Cards(
  ['Algorithms', ['Token bucket — allows bursts up to capacity','Leaky bucket — smooths to a constant outflow rate','Fixed window — simple, edge-of-window burst issue','Sliding window log/counter — accurate, more memory']],
  ['Where it lives', ['At the API gateway, in front of all services','Per-client key: user ID, API key, or IP','Distributed limiter needs shared state — Redis + Lua script','Return 429 with Retry-After header on rejection']]
)}
${talkTrack([
  'Pick token bucket as the default answer — it naturally allows short bursts while capping sustained rate, which matches real client behavior.',
  'Address distribution: a single-process in-memory counter breaks once you have multiple gateway instances — need Redis (INCR + EXPIRE, or a Lua script for atomicity).',
  'Mention granularity: per-user, per-IP, per-API-key, sometimes layered (global + per-user) to stop both abuse and noisy neighbors.',
  'Close with graceful degradation: return 429 + Retry-After rather than silently dropping, so well-behaved clients back off correctly.'
])}`,

hash: () => `
<div class="stage">
  <div class="stage-controls">
    <button class="btn primary" onclick="hashPlaceKey()">Place a key</button>
    <button class="btn" onclick="hashAddNode()">Add node</button>
    <button class="btn" onclick="hashReset()">Reset</button>
    <span class="status-line" id="hash-status">idle</span>
  </div>
  <svg viewBox="0 0 500 500" id="hash-svg">
    <circle cx="250" cy="250" r="180" fill="none" stroke="#1F3F66" stroke-width="2"/>
    <g id="hash-nodes"></g>
    <g id="hash-keys"></g>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#FFB020"></span> node</span>
    <span><span class="dot" style="background:#5EEAD4"></span> key</span>
    <span>key maps to the next node clockwise on the ring</span>
  </div>
</div>
${grid2Cards(
  ['Why not plain hash % N', ['hash(key) % N remaps almost every key when N changes','That means a full cache/data reshuffle on scale up/down','Consistent hashing bounds remapping to ~1/N of keys','Ring + clockwise lookup makes node changes cheap']],
  ['Real-world notes', ['Virtual nodes: each physical node gets many ring points','Virtual nodes smooth out uneven load distribution','Used in: DynamoDB, Cassandra, memcached client sharding, CDNs','Trade-off: slightly more complex than modulo sharding']]
)}
${talkTrack([
  'Open with the problem it solves: naive hash % N causes a full reshuffle whenever a node joins or leaves — expensive at scale.',
  'Describe the ring: both nodes and keys are hashed onto the same circular space; a key belongs to the first node clockwise from it.',
  'Explain why this bounds the blast radius: adding/removing one node only affects the keys between it and its neighbor, roughly 1/N of the total.',
  'Mention virtual nodes as the production refinement — without them, uneven node placement on the ring causes hot spots.'
])}`,

shard: () => `
<div class="stage">
  <div class="stage-controls">
    <label style="font-family:var(--mono); font-size:12px; color:var(--ink-dim);">Shard key:
      <select id="shard-key-select" onchange="shardReset()" style="background:#0E2440;color:#E8EDF4;border:1px solid #1F3F66;border-radius:4px;padding:4px 6px;font-family:var(--mono);">
        <option value="user">user_id</option>
        <option value="range">signup_date (range)</option>
      </select>
    </label>
    <button class="btn primary" onclick="shardRun()">Route 6 writes</button>
    <button class="btn" onclick="shardReset()">Reset</button>
    <span class="status-line" id="shard-status">idle</span>
  </div>
  <svg viewBox="0 0 760 240" id="shard-svg">
    <rect x="20" y="90" width="110" height="60" rx="8" fill="#0E2440" stroke="#FFB020" stroke-width="2"/>
    <text x="35" y="125" fill="#FFB020" font-size="12">Router</text>
    <g id="shard-nodes">
      <rect x="300" y="20" width="130" height="55" rx="6" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
      <text x="325" y="52" fill="#E8EDF4" font-size="12">Shard A</text>
      <rect x="300" y="93" width="130" height="55" rx="6" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
      <text x="325" y="125" fill="#E8EDF4" font-size="12">Shard B</text>
      <rect x="300" y="166" width="130" height="55" rx="6" fill="#0E2440" stroke="#1F3F66" stroke-width="2"/>
      <text x="325" y="198" fill="#E8EDF4" font-size="12">Shard C</text>
    </g>
    <line x1="130" y1="120" x2="300" y2="47" stroke="#1F3F66"/>
    <line x1="130" y1="120" x2="300" y2="120" stroke="#1F3F66"/>
    <line x1="130" y1="120" x2="300" y2="193" stroke="#1F3F66"/>
    <g id="shard-packets"></g>
    <g id="shard-labels"></g>
  </svg>
  <div class="legend">
    <span><span class="dot" style="background:#5EEAD4"></span> write, routed by shard key</span>
  </div>
</div>
${grid2Cards(
  ['Shard key choice', ['Hash-based (user_id % N or consistent hash) — even spread','Range-based (date, alpha) — easy range scans, risk of hotspots','Bad key = hot shard: pick high-cardinality, evenly-accessed field','Composite keys when one column alone isn’t selective enough']],
  ['Painful parts', ['Cross-shard joins / transactions are expensive or impossible','Resharding later is a major migration — plan headroom early','Celebrity/hotspot problem: one key gets disproportionate traffic','Often paired with a shard-lookup service or consistent hashing']]
)}
${talkTrack([
  'Say the goal plainly: no single database can hold or serve the whole dataset, so split rows across nodes by a shard key.',
  'Compare hash-based vs range-based sharding and pick one with a reason tied to the access pattern in the question (e.g. range for time-series scans, hash for uniform point lookups).',
  'Flag the real cost up front: cross-shard joins and multi-row transactions get hard — call out how you would work around it (denormalization, saga pattern, application-side joins).',
  'Mention resharding pain and how consistent hashing or a shard-mapping service reduces the blast radius of adding capacity later.'

replica: () => `

  <div class="card"><h3>Fan-out on write</h3><ul>
    <li>On post, push the post ID into every follower\'s precomputed feed list</li>

  </ul></div>

  'Call out the celebrity problem explicitly, since it\'s the detail that separates a junior from a senior answer: a 10M-follower post cannot fan out synchronously without melting the write path.',
  'Land on the hybrid: fan-out on write for the common case, fan-out on read (merge celebrity posts in at read time) for high-follower accounts — this is what real systems (Twitter, Instagram) actually do.'
])}`,

<script>
// ============ ANIMATION LOGIC ============
const NS='http://www.w3.org/2000/svg';
function el(tag, attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function animateAlong(group, x1,y1,x2,y2, color, duration, onDone){
  const dot = el('circle',{cx:x1, cy:y1, r:7, fill:color});
  group.appendChild(dot);
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    dot.setAttribute('cx', x1 + (x2-x1)*t);
    dot.setAttribute('cy', y1 + (y2-y1)*t);
    if(t<1) requestAnimationFrame(step);
    else { dot.remove(); if(onDone) onDone(); }
  }
  requestAnimationFrame(step);
}

/* ---------- Load Balancing ---------- */
let lbIdx=0, lbDown={2:false};
function lbRun(){
  const g = document.getElementById('lb-packets');
  const targets = {1:[540,57], 2:[540,129], 3:[540,201]};
  let order=[1,2,3].filter(n=>!lbDown[n]);
  const n = order[lbIdx % order.length]; lbIdx++;
  setStatus('lb-status', `routing to Server ${n}`);
  animateAlong(g, 55,120, 220,120, '#5EEAD4', 500, ()=>{
    animateAlong(g, 265,120, targets[n][0], targets[n][1], '#5EEAD4', 500, ()=>{
      setStatus('lb-status', `Server ${n} handled request`);
    });
  });
}
function lbFail(){
  lbDown[2]=true;
  const s2=document.getElementById('lb-s2');
  s2.setAttribute('stroke', '#FF6B6B');
  s2.setAttribute('fill', '#2A1218');
  setStatus('lb-status', 'Server 2 marked unhealthy — removed from rotation');
}
function lbReset(){
  lbIdx=0; lbDown={2:false};
  const s2=document.getElementById('lb-s2');
  s2.setAttribute('stroke','#1F3F66'); s2.setAttribute('fill','#0E2440');
  document.getElementById('lb-packets').innerHTML='';
  setStatus('lb-status','idle');
}

/* ---------- Cache ---------- */
function cacheRun(mode){
  const g = document.getElementById('cache-packets');
  g.innerHTML='';
  const label = document.getElementById('cache-label');
  const box = document.getElementById('cache-box');
  if(mode==='hit'){
    setStatus('cache-status','cache hit — fast path');
    label.textContent='HIT: cache → client (single hop)';
    box.setAttribute('stroke','#5EEAD4');
    animateAlong(g, 62,100, 320,100, '#5EEAD4', 450, ()=>{
      animateAlong(g, 320,100, 62,100, '#5EEAD4', 450, ()=>{
        setStatus('cache-status','done — served from cache');
        box.setAttribute('stroke','#1F3F66');
      });
    });
  } else {
    setStatus('cache-status','cache miss — falling through to DB');
    label.textContent='MISS: cache → DB → populate cache → client';
    box.setAttribute('stroke','#FF6B6B');
    animateAlong(g, 62,100, 320,100, '#5EEAD4', 400, ()=>{
      box.setAttribute('stroke','#1F3F66');
      animateAlong(g, 380,100, 620,100, '#5EEAD4', 450, ()=>{
        animateAlong(g, 620,100, 380,100, '#FFB020', 450, ()=>{
          document.getElementById('db-box').setAttribute('stroke','#1F3F66');
          label.textContent='cache populated — next read will be a hit';
          animateAlong(g, 320,100, 62,100, '#5EEAD4', 400, ()=>{
            setStatus('cache-status','done — DB read, cache warmed');
          });
        });
      });
    });
  }
}
function cacheReset(){
  document.getElementById('cache-packets').innerHTML='';
  document.getElementById('cache-label').textContent='';
  document.getElementById('cache-box').setAttribute('stroke','#1F3F66');
  document.getElementById('db-box').setAttribute('stroke','#1F3F66');
  setStatus('cache-status','idle');
}

/* ---------- CDN ---------- */
function cdnRun(mode){
  const g = document.getElementById('cdn-packets'); g.innerHTML='';
  if(mode==='hit'){
    setStatus('cdn-status','edge cache hit');
    animateAlong(g, 62,110, 320,110, '#5EEAD4', 450, ()=>{
      animateAlong(g, 320,110, 62,110, '#5EEAD4', 450, ()=>{
        setStatus('cdn-status','served entirely from edge — origin untouched');
      });
    });
  } else {
    setStatus('cdn-status','edge miss — pulling from origin');

/* ---------- Consistent hashing ---------- */
let hashNodes=[30, 150, 260], hashKeyCount=0;
const RING_CX=250, RING_CY=250, RING_R=180;
function polar(deg){
  const rad=(deg-90)*Math.PI/180;
  return [RING_CX+RING_R*Math.cos(rad), RING_CY+RING_R*Math.sin(rad)];
}
function renderRing(){
  const ng=document.getElementById('hash-nodes'); ng.innerHTML='';
  hashNodes.slice().sort((a,b)=>a-b).forEach((deg,i)=>{
    const [x,y]=polar(deg);
    ng.appendChild(el('circle',{cx:x,cy:y,r:9,fill:'#FFB020'}));
    const [tx,ty]=polar(deg);
    const t = el('text',{x:tx+ (Math.cos((deg-90)*Math.PI/180)>0?12:-45), y:ty, fill:'#FFB020','font-size':11});
    t.textContent='N'+(i+1); ng.appendChild(t);
  });
}
function nextNodeClockwise(deg){
  const sorted = hashNodes.slice().sort((a,b)=>a-b);
  for(const n of sorted) if(n>=deg) return n;
  return sorted[0];
}
function hashPlaceKey(){
  hashKeyCount++;
  const deg = Math.random()*360;
  const [kx,ky]=polar(deg);
  const target = nextNodeClockwise(deg);
  const [tx,ty]=polar(target);
  const kg=document.getElementById('hash-keys');
  const k = el('circle',{cx:kx,cy:ky,r:6,fill:'#5EEAD4'});
  kg.appendChild(k);
  const line = el('line',{x1:kx,y1:ky,x2:kx,y2:ky,stroke:'#5EEAD4','stroke-dasharray':'3 3'});
  kg.appendChild(line);
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/500);
    line.setAttribute('x2', kx+(tx-kx)*t);
    line.setAttribute('y2', ky+(ty-ky)*t);
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setStatus('hash-status', `key #${hashKeyCount} → next node clockwise`);
}
function hashAddNode(){
  const deg = Math.random()*360;
  hashNodes.push(deg);
  renderRing();
  setStatus('hash-status', `node added at ${deg.toFixed(0)}° — only keys between it and its neighbor remap`);
}
function hashReset(){
  hashNodes=[30,150,260]; hashKeyCount=0;
  renderRing();
  document.getElementById('hash-keys').innerHTML='';
  setStatus('hash-status','idle');
}
renderRing();

/* ---------- Saga ---------- */
function sagaSetStep(n, color){
  const el2 = document.getElementById('saga-s'+n);
  if(el2) el2.setAttribute('stroke', color);
}
function sagaRun(mode){
  sagaReset(false);
  const seq = [1,2,3,4];
  const failAt = mode==='fail' ? 3 : null;
  let i=0;
  function nextStep(){
    if(i>=seq.length) { setStatus('saga-status','saga completed successfully'); return; }
    const n = seq[i];
    setStatus('saga-status', `step ${n} in progress...`);
    sagaSetStep(n, '#5EEAD4');
    setTimeout(()=>{
      if(n===failAt){
        sagaSetStep(n, '#FF6B6B');
        setStatus('saga-status', `step ${n} FAILED — starting compensation`);
        document.getElementById('saga-compensate').style.display='block';
        setTimeout(()=>{
          sagaSetStep(2,'#FF6B6B');
          setTimeout(()=>{
            sagaSetStep(1,'#FF6B6B');
            setStatus('saga-status','compensated: stock released, order cancelled — system left consistent');
          },600);
        },600);
        return;
      }
      sagaSetStep(n, '#FFB020');
      i++;
      setTimeout(nextStep, 300);
    }, 650);
  }
  nextStep();
}
function sagaReset(resetStatus=true){
  [1,2,3,4].forEach(n=>sagaSetStep(n,'#1F3F66'));
  document.getElementById('saga-compensate').style.display='none';
  if(resetStatus) setStatus('saga-status','idle');
}
