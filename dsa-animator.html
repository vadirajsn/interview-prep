<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Pattern Player — Interview Prep Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14;
  --panel:#131722;
  --panel2:#161b28;
  --border:#232A3B;
  --text:#E7E6E2;
  --dim:#8B93A7;
  --amber:#E8A33D;
  --teal:#4FD1C5;
  --coral:#EF6B6B;
  --line:#3A4256;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100%;}
.app{display:flex;min-height:100vh;}
.sidebar{width:280px;flex-shrink:0;border-right:1px solid var(--border);padding:28px 20px;display:flex;flex-direction:column;gap:22px;}
.brand h1{font-size:19px;margin:0 0 8px;letter-spacing:.2px;}
.brand p{font-size:12.5px;color:var(--dim);margin:0;line-height:1.55;}
nav.topics{display:flex;flex-direction:column;gap:5px;}
.topic-btn{display:flex;flex-direction:column;gap:2px;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--radius);padding:9px 12px;cursor:pointer;color:var(--text);font-family:inherit;width:100%;}
.topic-btn:hover{background:var(--panel);}
.topic-btn.active{background:var(--panel);border-color:var(--border);}
.topic-btn .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);}
.topic-btn .name{font-size:13.5px;font-weight:600;}
.topic-btn .sub{font-size:11px;color:var(--dim);}
.sidebar-foot{margin-top:auto;font-size:11px;color:var(--dim);line-height:1.6;border-top:1px solid var(--border);padding-top:14px;}
.sidebar-foot kbd{font-family:'IBM Plex Mono',monospace;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
.stage{flex:1;padding:32px 40px;max-width:1080px;}
.stage-header h2{margin:0 0 8px;font-size:23px;}
.stage-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--dim);}
.stage-blurb{color:var(--dim);font-size:13.5px;line-height:1.6;max-width:740px;margin:0 0 16px;}
.mode-row{display:none;gap:8px;margin-bottom:16px;}
.mode-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;}
.mode-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.08);}
.canvas-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;}
canvas{width:100%;display:block;border-radius:8px;}
.controls{display:flex;align-items:center;gap:8px;margin:14px 0;flex-wrap:wrap;}
.ctrl-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber);}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed;}
.ctrl-btn.play{width:auto;padding:0 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;gap:6px;}
.speed-wrap{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;font-family:'IBM Plex Mono',monospace;}
#speedRange{accent-color:var(--amber);}
.step-counter{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}
.tape-outer{position:relative;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);padding:12px 0;}
.tape{display:flex;gap:3px;padding:0 10px;overflow-x:auto;}
.tape::-webkit-scrollbar{height:4px;}
.tape::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tape-tick{flex:0 0 auto;width:9px;height:22px;border-radius:3px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;}
.tape-tick.past{background:#1c2433;border-color:#2b3245;}
.tape-tick.active{background:var(--amber);border-color:var(--amber);}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
.panel-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.panel-box h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);}
#frameNote{font-size:14px;line-height:1.65;color:var(--text);min-height:70px;}
pre#codeBlock{margin:0;font-family:'IBM Plex Mono',monospace;font-size:12.3px;line-height:1.75;color:var(--dim);overflow-x:auto;white-space:pre;}
pre#codeBlock .ln{display:block;padding:1px 8px;border-radius:4px;}
pre#codeBlock .ln.active{background:rgba(232,163,61,.12);color:var(--amber);}
@media (max-width:900px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:14px;gap:14px;}
  .brand,.sidebar-foot{display:none;}
  nav.topics{flex-direction:row;}
  .topic-btn{flex-shrink:0;min-width:150px;}
  .stage{padding:18px;}
  .bottom-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <a href="index.html" style="display:inline-block; margin-bottom:12px; color:var(--mut); text-decoration:none; font-size:12px; border:1px solid var(--border); padding:4px 10px; border-radius:12px;">← Back to Home</a>
      <h1>DSA Pattern Player</h1>
      <p>Eight patterns behind most data-structure interview questions, replayed one step at a time.</p>
    </div>
    <nav class="topics" id="topicNav"></nav>
    <div class="sidebar-foot">
      <div><kbd>space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step</div>
    </div>
  </aside>
  <main class="stage">
    <div class="stage-header">
      <h2 id="stageTitle"></h2>
      <div class="stage-meta">
        <span class="pill" id="stageTag"></span>
        <span class="pill" id="stageLevel"></span>
      </div>
      <p class="stage-blurb" id="stageBlurb"></p>
      <div class="mode-row" id="modeRow"></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="1000" height="460"></canvas>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnReset" title="Reset">⟲</button>
      <button class="ctrl-btn" id="btnPrev" title="Previous step">◁</button>
      <button class="ctrl-btn play" id="btnPlay">▶ Play</button>
      <button class="ctrl-btn" id="btnNext" title="Next step">▷</button>
      <div class="speed-wrap">SPEED
        <input type="range" id="speedRange" min="1" max="4" value="2">
      </div>
      <div class="step-counter" id="stepCounter"></div>
    </div>

    <div class="tape-outer">
      <div class="tape" id="tape"></div>
    </div>

    <div class="bottom-grid">
      <div class="panel-box">
        <h3>What's happening</h3>
        <div id="frameNote"></div>
      </div>
      <div class="panel-box">
        <h3>Kotlin</h3>
        <pre id="codeBlock"></pre>
      </div>
    </div>
  </main>
</div>


<script>
"use strict";
/* =================================================================== helpers */
const C = { bg:"#0b1016", cell:"#1b242d", line:"#3a4854", ink:"#e6edf3", mut:"#9fb0bf",
  faint:"#71828f", blue:"#7aa2f7", green:"#9ece6a", amber:"#e0af68", purple:"#bb9af7",
  cyan:"#7dcfff", red:"#f7768e", dim:"#161d24" };

function box(ctx,x,y,w,h,fill,stroke,r=8){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.6; ctx.stroke(); }
}
function txt(ctx,s,x,y,size=15,color=C.ink,align="center",font="ui-monospace,Menlo,monospace"){
  ctx.fillStyle=color; ctx.font=`${size}px ${font}`; ctx.textAlign=align; ctx.textBaseline="middle";
  ctx.fillText(s,x,y);
}
function tagline(ctx,s,x=500,y=24){ txt(ctx,s,x,y,13,C.faint,"center","-apple-system,Segoe UI,Roboto,sans-serif"); }

/* array of cells with optional pointer arrows underneath */
function cells(ctx,vals,x,y,w,h,opts={}){
  const {hi={},labels=null,gap=6}=opts;
  const cw=Math.min(74,(1000-2*x-(vals.length-1)*gap)/vals.length);
  vals.forEach((v,i)=>{
    const cx=x+i*(cw+gap);
    const st=hi[i]||{};
    box(ctx,cx,y,cw,h, st.fill||C.cell, st.stroke||C.line);
    txt(ctx,String(v),cx+cw/2,y+h/2,16,st.color||C.ink);
    if(labels&&labels[i]!=null) txt(ctx,String(labels[i]),cx+cw/2,y+h+16,11,C.faint);
  });
  return {cw,gap,x0:x};
}
function pointer(ctx,geom,i,label,color,row=0){
  const cx=geom.x0+i*(geom.cw+geom.gap)+geom.cw/2, ty=geom.py||0;
  const y=(geom.y||0);
  ctx.beginPath(); ctx.moveTo(cx,y+4+row*30); ctx.lineTo(cx-7,y+18+row*30); ctx.lineTo(cx+7,y+18+row*30);
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  txt(ctx,label,cx,y+30+row*30,12,color);
}


/* =================================================================== patterns */
const PATTERNS=[];

/* ---------- 1 · Minimum Sum (target-round sample 1) ---------- */
PATTERNS.push({
  id:"minsum", name:"Minimum Sum", d:"sample · heap greedy",
  build(){
    let a=[10,20,7], k=4, f=[];
    const sum=x=>x.reduce((s,v)=>s+v,0);
    f.push({vals:[...a],hi:{},say:"<b>nums = [10, 20, 7], k = 4.</b> Each operation halves one element (ceiling). Greedy claim: always halve the current <b>largest</b> — it gives the biggest single reduction, floor(x/2)."});
    for(let op=1;op<=k;op++){
      const mi=a.indexOf(Math.max(...a));
      f.push({vals:[...a],hi:{[mi]:{fill:"#2a2438",stroke:C.purple,color:C.purple}},
        say:`Operation ${op}: the largest is <b>${a[mi]}</b>. Halving it reduces the sum by floor(${a[mi]}/2) = <b>${Math.floor(a[mi]/2)}</b> — more than halving anything else would.`});
      a[mi]=Math.ceil(a[mi]/2);
      f.push({vals:[...a],hi:{[mi]:{fill:"#1f2d24",stroke:C.green,color:C.green}},
        say:`It becomes ceil = <b>${a[mi]}</b>. Sum is now <b>${sum(a)}</b>.`});
    }
    f.push({vals:[...a],hi:Object.fromEntries(a.map((_,i)=>[i,{stroke:C.green}])),
      say:`Done: [${a.join(", ")}], sum = <b>${sum(a)}</b> — the minimum. In code this is a <b>max-heap</b>: pop, halve, push, k times. O(n + k log n). Trap: <code>(x+1)/2</code> for the ceiling, and stop early when the max is 1.`});
    return f;
  },
  render(ctx,fr){
    tagline(ctx,"always halve the current largest — max-heap greedy");
    const g=cells(ctx,fr.vals,320,150,0,86,{hi:fr.hi});
    const s=fr.vals.reduce((a,b)=>a+b,0);
    txt(ctx,"sum = "+s,500,320,22,C.amber);
  },
  kotlin:`<span class="k">val</span> heap = <span class="ty">PriorityQueue</span>&lt;<span class="ty">Int</span>&gt;(compareByDescending { it })
nums.forEach { heap.add(it) }
<span class="k">var</span> sum = nums.sum().toLong()
<span class="k">repeat</span>(k) {
    <span class="k">val</span> top = heap.poll()
    <span class="k">if</span> (top &lt;= <span class="nu">1</span>) <span class="k">return@repeat</span>       <span class="cm">// no further progress</span>
    <span class="k">val</span> halved = (top + <span class="nu">1</span>) / <span class="nu">2</span>       <span class="cm">// integer ceiling</span>
    sum -= (top - halved)
    heap.add(halved)
}`,
  java:`<span class="ty">PriorityQueue</span>&lt;<span class="ty">Integer</span>&gt; heap = <span class="k">new</span> <span class="ty">PriorityQueue</span>&lt;&gt;(<span class="ty">Comparator</span>.reverseOrder());
<span class="k">for</span> (<span class="k">int</span> v : nums) heap.add(v);
<span class="k">long</span> sum = ...;
<span class="k">while</span> (k-- &gt; <span class="nu">0</span>) {
    <span class="k">int</span> top = heap.poll();
    <span class="k">if</span> (top &lt;= <span class="nu">1</span>) <span class="k">break</span>;
    <span class="k">int</span> halved = (top + <span class="nu">1</span>) / <span class="nu">2</span>;    <span class="cm">// NOT Math.ceil(top/2) — that floors first</span>
    sum -= (top - halved);
    heap.add(halved);
}`
});

/* ---------- 2 · Grid + Pickaxe (target-round sample 2) ---------- */
PATTERNS.push({
  id:"pickaxe", name:"Grid + Pickaxe", d:"sample · BFS unlock",
  build(){
    // sample 2 of the sample doc: NO case
    const rows=[".*.","**."], sr=1,sc=2, dr=0,dc=1; // 0-based (2,3)->(1,2)
    const m=2,n=3;
    const state=Array.from({length:m},(_,r)=>rows[r].split("").map(ch=>ch==="."?0:2)); // 0 free,1 reached,2 block,3 hit1,4 brokenReached
    const f=[];
    const snap=(say,extra={})=>f.push({state:state.map(r=>[...r]),sr,sc,dr,dc,say,...extra});
    snap("<b>Sample 2.</b> '.' free, '*' hollow block. A block breaks only when you can reach <b>two or more</b> of its neighbours. Start (2,3), destination (1,2). Is there a path?");
    state[sr][sc]=1;
    snap("BFS from the start. The frontier holds reachable free cells; every blocked neighbour gets a hit counter.");
    const q=[[sr,sc]]; const D=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      const [r,c]=q.shift();
      for(const [dy,dx] of D){
        const nr=r+dy,nc=c+dx;
        if(nr<0||nr>=m||nc<0||nc>=n) continue;
        const s=state[nr][nc];
        if(s===0){ state[nr][nc]=1; q.push([nr,nc]);
          snap(`Reached free cell (${nr+1},${nc+1}).`);}
        else if(s===2){ state[nr][nc]=3;
          snap(`Hit block (${nr+1},${nc+1}) from one side — counter = 1. Not enough to break it.`);}
        else if(s===3){ state[nr][nc]=4; q.push([nr,nc]);
          snap(`Second side reaches block (${nr+1},${nc+1}) — counter = 2, it <b>breaks</b> and joins the frontier.`);}
      }
    }
    const yes = state[dr][dc]===1||state[dr][dc]===4;
    snap(`Frontier exhausted. Destination (1,2) has hit counter 1 — its other neighbours are free but <b>unreachable</b>, and a free cell that can't be reached can never supply a hit. Answer: <b>${yes?"YES":"NO"}</b>. That is the whole trap: “two sides” means two <i>reachable</i> neighbours.`);
    return f;
  },
  render(ctx,fr){
    tagline(ctx,"blocks unlock at 2 hits — but hits must come from REACHABLE cells");
    const cs=104,gap=10,x0=500-(3*cs+2*gap)/2,y0=110;
    for(let r=0;r<2;r++)for(let c=0;c<3;c++){
      const s=fr.state[r][c];
      let fill=C.cell, stroke=C.line, label="", lc=C.ink;
      if(s===1){fill="#1f2d24";stroke=C.green;}
      if(s===2){fill="#2a1f26";stroke=C.red;label="*";lc=C.red;}
      if(s===3){fill="#2a1f26";stroke=C.amber;label="*1";lc=C.amber;}
      if(s===4){fill="#1f2d24";stroke=C.green;label="broken";lc=C.green;}
      box(ctx,x0+c*(cs+gap),y0+r*(cs+gap),cs,cs,fill,stroke,10);
      if(label) txt(ctx,label,x0+c*(cs+gap)+cs/2,y0+r*(cs+gap)+cs/2,label.length>2?13:20,lc);
    }
    txt(ctx,"S",x0+fr.sc*(cs+gap)+cs/2,y0+fr.sr*(cs+gap)+cs-16,13,C.cyan);
    txt(ctx,"DEST",x0+fr.dc*(cs+gap)+cs/2,y0+fr.dr*(cs+gap)+18,11,C.purple);
    txt(ctx,"reached",x0-70,y0+30,12,C.green,"right");
    txt(ctx,"block",x0-70,y0+60,12,C.red,"right");
  },
  kotlin:`<span class="k">val</span> hits = <span class="ty">Array</span>(m) { <span class="ty">IntArray</span>(n) }
<span class="k">while</span> (queue.isNotEmpty()) {
    <span class="k">val</span> (r, c) = queue.removeFirst()
    <span class="k">for</span> ((dy, dx) <span class="k">in</span> dirs) {
        <span class="k">val</span> nr = r + dy; <span class="k">val</span> nc = c + dx
        <span class="k">if</span> (nr !in <span class="nu">0</span> until m || nc !in <span class="nu">0</span> until n || reached[nr][nc]) <span class="k">continue</span>
        <span class="k">if</span> (grid[nr][nc] == <span class="s">'.'</span>) { reached[nr][nc] = <span class="k">true</span>; queue.add(nr <span class="k">to</span> nc) }
        <span class="k">else if</span> (++hits[nr][nc] &gt;= <span class="nu">2</span>) {   <span class="cm">// unlock on the 2nd REACHABLE side</span>
            reached[nr][nc] = <span class="k">true</span>; queue.add(nr <span class="k">to</span> nc)
        }
    }
}`,
  java:`<span class="k">int</span>[][] hits = <span class="k">new int</span>[m][n];
<span class="k">while</span> (!q.isEmpty()) {
    <span class="k">int</span>[] cur = q.poll();
    <span class="k">for</span> (<span class="k">int</span> i = <span class="nu">0</span>; i &lt; <span class="nu">4</span>; i++) {
        <span class="k">int</span> r = cur[<span class="nu">0</span>] + dy[i], c = cur[<span class="nu">1</span>] + dx[i];
        <span class="k">if</span> (r &lt; <span class="nu">0</span> || r &gt;= m || c &lt; <span class="nu">0</span> || c &gt;= n || reached[r][c]) <span class="k">continue</span>;
        <span class="k">if</span> (grid[r][c] == <span class="s">'.'</span>) { reached[r][c] = <span class="k">true</span>; q.add(<span class="k">new int</span>[]{r, c}); }
        <span class="k">else if</span> (++hits[r][c] &gt;= <span class="nu">2</span>) {      <span class="cm">// monotone unlock — same trick as Kahn's</span>
            reached[r][c] = <span class="k">true</span>; q.add(<span class="k">new int</span>[]{r, c});
        }
    }
}`
});

/* ---------- 3 · Sorting 2D (target-round sample) ---------- */
PATTERNS.push({
  id:"sort2d", name:"Sorting 2D", d:"sample · k-way merge",
  build(){
    const m=[[10,20,30],[12,22,32],[15,25,35]];
    const cur=[0,0,0], out=[], f=[];
    const snap=(say,pick=-1)=>f.push({m,cur:[...cur],out:[...out],pick,say});
    snap("Rows are sorted, columns are sorted. Treat each <b>row as a sorted list</b> and do a k-way merge: a min-heap holds one cursor per row.");
    while(out.length<9){
      let best=-1,bv=Infinity;
      for(let r=0;r<3;r++) if(cur[r]<3 && m[r][cur[r]]<bv){bv=m[r][cur[r]];best=r;}
      snap(`Heads are ${cur.map((c,r)=>c<3?m[r][c]:"—").join(", ")}. The smallest is <b>${bv}</b> (row ${best+1}) — pop it.`,best);
      out.push(bv); cur[best]++;
      snap(`Emit ${bv}; advance row ${best+1}'s cursor. Output so far: [${out.join(", ")}].`);
    }
    snap("All cursors exhausted. <b>O(n² log n) time — provably optimal — and O(n) heap space</b>, which is the real win over flatten-and-sort's O(n²) space. Say the space argument, not a false speed claim.");
    return f;
  },
  render(ctx,fr){
    tagline(ctx,"k-way merge: one cursor per sorted row, min-heap picks the smallest head");
    const cs=64,gap=8;
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){
      const x=120+c*(cs+gap), y=90+r*(cs+gap);
      const used=c<fr.cur[r];
      const isHead=c===fr.cur[r];
      const picked=fr.pick===r&&isHead;
      box(ctx,x,y,cs,cs, used?"#10151b":picked?"#2a2438":isHead?"#1b242d":C.cell,
          picked?C.purple:isHead?C.cyan:used?"#232a33":C.line,8);
      txt(ctx,String(fr.m[r][c]),x+cs/2,y+cs/2,15,used?C.faint:picked?C.purple:isHead?C.cyan:C.ink);
    }
    txt(ctx,"rows = sorted lists",228,66,12,C.faint);
    txt(ctx,"output",700,66,12,C.faint);
    fr.out.forEach((v,i)=>{
      const x=560+(i%5)*(cs+6), y=90+Math.floor(i/5)*(cs+6);
      box(ctx,x,y,cs,52,"#1f2d24",C.green,8);
      txt(ctx,String(v),x+cs/2,y+26,14,C.green);
    });
  },
  kotlin:`<span class="k">val</span> heap = <span class="ty">PriorityQueue</span>&lt;<span class="ty">Triple</span>&lt;<span class="ty">Int</span>,<span class="ty">Int</span>,<span class="ty">Int</span>&gt;&gt;(compareBy { it.first })
<span class="k">for</span> (r <span class="k">in</span> <span class="nu">0</span> until n) heap.add(<span class="ty">Triple</span>(m[r][<span class="nu">0</span>], r, <span class="nu">0</span>))   <span class="cm">// (value, row, col)</span>
<span class="k">while</span> (heap.isNotEmpty()) {
    <span class="k">val</span> (v, r, c) = heap.poll()
    out += v

PATTERNS.push({
  id:"window", name:"Longest Substring", d:"ours · sliding window",
  build(){
    const s="abcabcbb"; const f=[]; const last=new Map();
    let left=0,best=0,bestL=0,bestR=-1;
    f.push({s,left:0,right:-1,best:0,bestL:0,bestR:-1,say:"<b>\"abcabcbb\"</b> — longest substring without repeating characters. Grow the right edge; when a repeat lands inside the window, jump the left edge past its previous position."});
    for(let right=0;right<s.length;right++){
      const ch=s[right];
      let jumped=false;
      if(last.has(ch)&&last.get(ch)>=left){ left=last.get(ch)+1; jumped=true; }
      last.set(ch,right);
      if(right-left+1>best){ best=right-left+1; bestL=left; bestR=right; }
      f.push({s,left,right,best,bestL,bestR,
        say: jumped
          ? `'${ch}' repeats inside the window — <b>jump</b> left past its last occurrence, straight to ${left}. Never step one at a time.`
          : `Extend right to include '${ch}'. Window [${left}..${right}] length ${right-left+1}${right-left+1===best?" — new best":""}.`});
    }
    f.push({s,left,right:s.length-1,best,bestL,bestR,
      say:`Answer: <b>${best}</b> ("${s.slice(bestL,bestR+1)}"). One pass, each pointer only moves forward — O(n). The phrase “longest substring with…” should trigger this pattern instantly.`});
    return f;
  },
  render(ctx,fr){
    tagline(ctx,"grow the right edge · jump the left past repeats");
    const chars=fr.s.split("");

      if(fr.right>=0&&i>=fr.left&&i<=fr.right) hi[i]={fill:"#26313d",stroke:C.cyan};

    }

  },
  kotlin:`<span class="k">val</span> last = <span class="ty">HashMap</span>&lt;<span class="ty">Char</span>, <span class="ty">Int</span>&gt;()
<span class="k">var</span> best = <span class="nu">0</span>; <span class="k">var</span> left = <span class="nu">0</span>
<span class="k">for</span> (right <span class="k">in</span> s.indices) {
    last[s[right]]?.let { <span class="k">if</span> (it &gt;= left) left = it + <span class="nu">1</span> }  <span class="cm">// jump, don't creep</span>
    last[s[right]] = right
    best = maxOf(best, right - left + <span class="nu">1</span>)
}`,
  java:`<span class="ty">Map</span>&lt;<span class="ty">Character</span>, <span class="ty">Integer</span>&gt; last = <span class="k">new</span> <span class="ty">HashMap</span>&lt;&gt;();
<span class="k">int</span> best = <span class="nu">0</span>, left = <span class="nu">0</span>;
<span class="k">for</span> (<span class="k">int</span> right = <span class="nu">0</span>; right &lt; s.length(); right++) {
    <span class="k">char</span> c = s.charAt(right);
    <span class="ty">Integer</span> prev = last.get(c);
    <span class="k">if</span> (prev != <span class="k">null</span> &amp;&amp; prev &gt;= left) left = prev + <span class="nu">1</span>;

PATTERNS.push({

    f.push({t,i:-1,stack:[],ans:[...ans],say:"<b>Next warmer day for each temperature.</b> The phrase “next greater element” = <b>monotonic stack</b>: keep indices of a strictly decreasing run; each new value pops everything it beats."});
    for(let i=0;i<t.length;i++){
      let popped=[];
      while(stack.length && t[i]>t[stack[stack.length-1]]){
        const j=stack.pop(); ans[j]=i-j; popped.push(j);
        f.push({t,i,stack:[...stack],ans:[...ans],say:`${t[i]} beats ${t[j]} (index ${j}) — pop it, its answer is <b>${i-j}</b> day(s).`});
      }
      stack.push(i);
      if(!popped.length) f.push({t,i,stack:[...stack],ans:[...ans],say:`${t[i]} doesn't beat the stack top — push index ${i}. The stack stays decreasing.`});
      else f.push({t,i,stack:[...stack],ans:[...ans],say:`Now push index ${i} — the stack is decreasing again.`});
    }
    f.push({t,i:t.length-1,stack:[...stack],ans:[...ans],say:`Whatever remains never found a warmer day — answer 0. Each index is pushed and popped <b>at most once</b>, so the whole thing is O(n) despite the nested-looking loop.`});

<span class="k">for</span> (i <span class="k">in</span> t.indices) {

/* =================================================================== app logic =================================================================== */
const cv = document.getElementById("canvas");
const ctx = cv.getContext("2d");
const btnReset = document.getElementById("btnReset");
const btnPrev = document.getElementById("btnPrev");
const btnPlay = document.getElementById("btnPlay");
const btnNext = document.getElementById("btnNext");
const speedRange = document.getElementById("speedRange");
const stepCounter = document.getElementById("stepCounter");
const tape = document.getElementById("tape");
const frameNote = document.getElementById("frameNote");
const codeBlock = document.getElementById("codeBlock");
const topicNav = document.getElementById("topicNav");

let cur = null;
let frames = [];
let fidx = 0;
let playing = false;
let playTimer = null;
let codeLines = [];

// Populate topics
topicNav.innerHTML = "";
PATTERNS.forEach((p, i) => {
  const btn = document.createElement("button");
  btn.className = "topic-btn";
  btn.innerHTML = `<span class="num">\${(i+1).toString().padStart(2,'0')}</span><span class="name">\${p.name}</span><span class="sub">\${p.d}</span>`;
  btn.onclick = () => loadTopic(i);
  topicNav.appendChild(btn);
});

function loadTopic(idx) {
  document.querySelectorAll(".topic-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
  cur = PATTERNS[idx];
  document.getElementById("stageTitle").textContent = cur.name;
  document.getElementById("stageTag").textContent = cur.d;
  document.getElementById("stageLevel").textContent = "Algorithm";
  
  if(cur.build) {
      frames = cur.build();
  } else {
      frames = [{say:"No build function yet"}];
  }
  
  // Format code
  if(cur.kotlin) {
      // split and wrap
      const rawLines = cur.kotlin.split("\n");
      codeLines = rawLines;
      codeBlock.innerHTML = rawLines.map((l, i) => `<span class="ln" id="ln-\${i+1}">\${l || ' '}</span>`).join("\n");
  } else {
      codeBlock.innerHTML = "No code available.";
  }
  
  fidx = 0;
  pause();
  updateTapeUI();
  draw();
  
  // Update URL
  const url = new URL(window.location);
  url.searchParams.set('pattern', cur.id);
  window.history.replaceState({}, '', url);
}

function updateTapeUI() {
  tape.innerHTML = "";
  frames.forEach((_, i) => {
    const tick = document.createElement("div");
    tick.className = "tape-tick";
    tick.onclick = () => { fidx = i; draw(); pause(); };
    tape.appendChild(tick);
  });
}

function draw() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!frames.length) return;
  const fr = frames[fidx];
  
  if(cur.render) {
      ctx.save();
      cur.render(ctx, fr);
      ctx.restore();
  }
  
  // Update UI
  stepCounter.textContent = `Step \${fidx+1} / \${frames.length}`;
  frameNote.innerHTML = fr.say || fr.note || "";
  
  // Update Tape
  const ticks = tape.children;
  for(let i=0; i<ticks.length; i++){
    ticks[i].className = "tape-tick" + (i < fidx ? " past" : (i === fidx ? " active" : ""));
  }
  
  // Scroll tape
  if(ticks[fidx]) ticks[fidx].scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
  
  // Code highlight
  document.querySelectorAll("#codeBlock .ln").forEach(el => el.classList.remove("active"));
  if (fr.line) {
    const activeLine = document.getElementById("ln-" + fr.line);
    if(activeLine) {
       activeLine.classList.add("active");
       activeLine.scrollIntoView({behavior:"smooth", block:"nearest"});
    }
  }
}

function next() {
  if (fidx < frames.length - 1) {
    fidx++; draw();
  } else {
    pause();
  }
}

function prev() {
  if (fidx > 0) {
    fidx--; draw();
  }
}

function togglePlay() {
  if (playing) pause();
  else play();
}

function play() {
  if (fidx >= frames.length - 1) fidx = 0;
  playing = true;
  btnPlay.innerHTML = "⏸ Pause";
  btnPlay.style.background = C.purple;
  btnPlay.style.borderColor = C.purple;
  btnPlay.style.color = "#000";
  loop();
}

function pause() {
  playing = false;
  btnPlay.innerHTML = "▶ Play";
  btnPlay.style.background = C.panel;
  btnPlay.style.borderColor = C.border;
  btnPlay.style.color = C.text;
  clearTimeout(playTimer);
}

function loop() {
  if (!playing) return;
  draw();
  if (fidx < frames.length - 1) {
    fidx++;
    let ms = parseInt(speedRange.value);
    let delay = ms === 1 ? 1200 : ms === 2 ? 800 : ms === 3 ? 400 : 150;
    playTimer = setTimeout(loop, delay);
  } else {
    pause();
  }
}

btnReset.onclick = () => { fidx=0; draw(); pause(); };
btnPrev.onclick = () => { prev(); pause(); };
btnNext.onclick = () => { next(); pause(); };
btnPlay.onclick = togglePlay;
window.onkeydown = e => {
  if(e.key===" ") { e.preventDefault(); togglePlay(); }
  if(e.key==="ArrowRight") { if(!playing) next(); }
  if(e.key==="ArrowLeft") { if(!playing) prev(); }
};

// Check URL params
const params = new URLSearchParams(window.location.search);
const pId = params.get('pattern') || params.get('topic');
let initIdx = 0;
if(pId) {
    const found = PATTERNS.findIndex(p => p.id === pId);
    if(found >= 0) initIdx = found;
}
loadTopic(initIdx);
</script>
